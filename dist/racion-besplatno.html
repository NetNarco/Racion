/**
 * Дизайн-система: дневная и ночная темы, полноэкранный каркас для десктопа
 * и мобильная раскладка. Все цвета — только через переменные.
 */

/* ── Темы ─────────────────────────────────────────────────────────────── */
:root,
html[data-theme='day'] {
  color-scheme: light;
  --bg: #FBF7F1;
  --bg-2: #F3EBDF;
  --bg-grad: radial-gradient(120% 80% at 50% -20%, #FFFDF9 0%, #FBF6EF 55%, #F4EBDF 100%);
  --surface: #FFFFFF;
  --surface-2: #FFFBF6;
  --surface-3: #F6EFE5;
  --ink: #17130F;
  --ink-2: #2A2118;
  --ink-3: #4A4036;
  --muted: #6E6358;
  --muted-2: #8B7F71;
  --muted-3: #A2947F;
  --line: #ECE2D4;
  --line-2: #E2D7C6;
  --line-3: #F2EAE0;
  --accent: #E8763A;
  --accent-2: #F58A4B;
  --accent-ink: #FFFFFF;
  --accent-soft: #FFF1E4;
  --accent-soft-2: #FFE6D2;
  --accent-line: #F6C89C;
  --grad: linear-gradient(135deg, #FFC46B 0%, #F98B4C 55%, #F06B39 100%);
  --grad-soft: linear-gradient(135deg, #FFE3C2, #FFD0A8);
  --shadow-s: 0 1px 2px rgba(80, 55, 30, .05), 0 2px 8px rgba(80, 55, 30, .05);
  --shadow-m: 0 2px 4px rgba(80, 55, 30, .05), 0 10px 24px rgba(80, 55, 30, .08);
  --shadow-l: 0 24px 60px rgba(80, 55, 30, .14);
  --shadow-accent: 0 8px 20px rgba(232, 118, 58, .26);
  --ok: #2F7D57;
  --ok-bg: #EAF4EE;
  --ok-line: #CBE3D5;
  --warn: #8A6420;
  --warn-bg: #FDF4E2;
  --warn-line: #F0DDB4;
  --danger: #C94F35;
  --danger-bg: #FCEBE6;
  --chip-bg: #FFFFFF;
  --scrim: rgba(28, 20, 12, .38);
  --header-bg: rgba(251, 247, 241, .82);
}

html[data-theme='night'] {
  color-scheme: dark;
  --bg: #1c1c1e;
  --bg-2: #2c2c2e;
  --bg-grad: radial-gradient(120% 80% at 50% -20%, #3a3a3c 0%, #1c1c1e 55%, #141416 100%);
  --surface: #2c2c2e;
  --surface-2: #3a3a3c;
  --surface-3: #48484a;
  --ink: #f2f2f7;
  --ink-2: #e5e5ea;
  --ink-3: #aeaeb2;
  --muted: #8e8e93;
  --muted-2: #636366;
  --muted-3: #48484a;
  --line: #38383a;
  --line-2: #48484a;
  --line-3: #2c2c2e;
  --accent: #ff9f0a;
  --accent-2: #ffb340;
  --accent-ink: #1c1c1e;
  --accent-soft: #3d2e1e;
  --accent-soft-2: #4d3a24;
  --accent-line: #664d2e;
  --grad: linear-gradient(135deg, #ffb340 0%, #ff9f0a 55%, #e68500 100%);
  --grad-soft: linear-gradient(135deg, #3d2e1e, #332414);
  --shadow-s: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-m: 0 2px 6px rgba(0, 0, 0, .45), 0 12px 28px rgba(0, 0, 0, .35);
  --shadow-l: 0 24px 70px rgba(0, 0, 0, .55);
  --shadow-accent: 0 10px 26px rgba(255, 159, 10, .28);
  --ok: #30d158;
  --ok-bg: #1b3a26;
  --ok-line: #245c38;
  --warn: #ffd60a;
  --warn-bg: #3d3314;
  --warn-line: #5c4e1c;
  --danger: #ff453a;
  --danger-bg: #3d1c1a;
  --chip-bg: #3a3a3c;
  --scrim: rgba(0, 0, 0, .62);
  --header-bg: rgba(28, 28, 30, .82);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
body { transition: background .25s ease, color .25s ease; }

img { display: block; }
button, input { font-family: inherit; }
button { color: inherit; }

/* ── Фон приложения ──────────────────────────────────────────────────── */
.app { min-height: 100dvh; background: var(--bg-grad); background-attachment: fixed; }

/* ── Каркас: мобильный и десктопный ──────────────────────────────────── */
.shell {
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: 0 20px;
}
.shell-body { flex: 1; padding-bottom: 132px; }
.shell-side { display: none; }

@media (min-width: 1000px) {
  .shell {
    max-width: 1180px;
    display: grid;
    grid-template-columns: 268px minmax(0, 1fr);
    gap: 44px;
    padding: 0 40px;
    align-items: start;
  }
  .shell-body { max-width: 640px; width: 100%; padding-bottom: 120px; padding-top: 4px; }
  .shell-side {
    display: block;
    position: sticky;
    top: 0;
    align-self: start;
    max-height: 100dvh;
    overflow-y: auto;
    padding: 30px 0 40px;
    scrollbar-width: thin;
  }
  .shell.no-side { grid-template-columns: minmax(0, 640px); justify-content: center; }
  .shell.no-side .shell-side { display: none; }
}

/* ── Верхняя панель ──────────────────────────────────────────────────── */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 10px;
  padding: 12px 0 12px;
  background: var(--header-bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.topbar .grow { flex: 1; }

.icon-btn {
  border: 1px solid var(--line);
  background: var(--surface);
  width: 40px; height: 40px; border-radius: 13px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 17px; cursor: pointer; flex: none;
  box-shadow: var(--shadow-s);
  transition: transform .12s ease, border-color .15s;
}
.icon-btn:hover { border-color: var(--accent-line); }
.icon-btn:active { transform: scale(.94); }
.text-btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 13px;
  padding: 0 14px; height: 40px; display: inline-flex; align-items: center; gap: 7px;
  font-size: 13.5px; font-weight: 700; color: var(--ink-2); cursor: pointer;
  box-shadow: var(--shadow-s); transition: transform .12s ease, border-color .15s;
}
.text-btn:hover { border-color: var(--accent-line); }
.text-btn:active { transform: scale(.97); }

/* ── Типографика ─────────────────────────────────────────────────────── */
h1.title {
  margin: 4px 0 8px;
  font-size: clamp(23px, 4.4vw, 33px);
  font-weight: 800; line-height: 1.14; letter-spacing: -.7px;
}
p.sub {
  margin: 0 0 18px;
  font-size: clamp(14.5px, 1.7vw, 16px);
  font-weight: 500; line-height: 1.5; color: var(--muted);
  max-width: 60ch;
}
.label-cap {
  font-size: 11.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted-3); margin-bottom: 10px;
}
.hint { font-size: 13.5px; font-weight: 600; line-height: 1.45; color: var(--muted-2); }
.mono-num { font-variant-numeric: tabular-nums; }

/* ── Прогресс ────────────────────────────────────────────────────────── */
.progress { margin: 2px 0 18px; }
.progress-bar { display: flex; gap: 5px; }
.progress-seg { flex: 1; height: 5px; border-radius: 999px; background: var(--line-2); transition: background .2s; }
.progress-seg.on { background: var(--grad); }
.progress-meta {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 9px; font-size: 13px; font-weight: 700; color: var(--muted);
}
.progress-meta .count { font-size: 12.5px; color: var(--muted-3); font-variant-numeric: tabular-nums; }

/* Боковая панель прогресса на десктопе */
.side-steps { display: flex; flex-direction: column; gap: 2px; margin-top: 16px; }
.side-step {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 11px;
  font-size: 13.5px; font-weight: 600; color: var(--muted-3);
}
.side-step.done { color: var(--muted); }
.side-step.now { background: var(--accent-soft); color: var(--accent); font-weight: 800; }
.side-step .num {
  width: 20px; height: 20px; border-radius: 50%; flex: none; font-size: 11px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface-3); color: var(--muted-3);
}
.side-step.done .num { background: var(--ok-bg); color: var(--ok); }
.side-step.now .num { background: var(--grad); color: var(--accent-ink); }

/* ── Карточки ────────────────────────────────────────────────────────── */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
  padding: 20px; box-shadow: var(--shadow-s);
}
.card.compact { border-radius: 16px; padding: 14px 16px; }
.card.tight { padding: 4px 16px; border-radius: 18px; }

.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.spacer-8 { height: 8px; } .spacer-10 { height: 10px; }
.spacer-12 { height: 12px; } .spacer-16 { height: 16px; } .spacer-20 { height: 20px; }

/* ── Кнопки ──────────────────────────────────────────────────────────── */
.btn {
  width: 100%; border: none; border-radius: 16px; padding: 18px;
  font-size: 17px; font-weight: 800; letter-spacing: -.1px;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  cursor: pointer; background: var(--grad); color: var(--accent-ink);
  box-shadow: var(--shadow-accent);
  transition: transform .12s ease, filter .15s ease;
}
.btn:hover:not([disabled]) { filter: brightness(1.04); }
.btn:active:not([disabled]) { transform: scale(.985); }
.btn[disabled] { background: var(--surface-3); color: var(--muted-3); box-shadow: none; cursor: default; }
.btn .chev {
  display: block; width: 8px; height: 8px; border-top: 2.5px solid currentColor;
  border-right: 2.5px solid currentColor; transform: rotate(45deg); margin-left: 2px;
}
.btn-ghost { background: var(--surface); color: var(--ink-2); box-shadow: var(--shadow-s); border: 1px solid var(--line); }
.btn-quiet { background: transparent; color: var(--muted); box-shadow: none; font-weight: 700; font-size: 15px; }

.cta-dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding: 14px 20px calc(18px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(180deg, transparent, var(--bg) 42%);
}
.cta-dock .dock-inner { max-width: 560px; margin: 0 auto; }
@media (min-width: 1000px) {
  /* На десктопе кнопка встаёт ровно в колонку контента. */
  .cta-dock {
    left: 50%; right: auto; transform: translateX(-50%);
    width: min(100%, 1180px);
    padding: 16px 40px 26px;
    background: linear-gradient(180deg, transparent, var(--bg) 55%);
  }
  .cta-dock .dock-inner {
    max-width: none; margin: 0;
    display: grid; grid-template-columns: 268px minmax(0, 1fr); gap: 44px;
  }
  .cta-dock .dock-col { grid-column: 2; justify-self: start; max-width: 640px; width: 100%; }
  .dock-wrap.no-side .cta-dock .dock-inner { grid-template-columns: minmax(0, 640px); justify-content: center; }
  .dock-wrap.no-side .cta-dock .dock-col { grid-column: 1; max-width: 640px; }
}

/* ── Варианты выбора ─────────────────────────────────────────────────── */
.opt {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 9px; text-align: center; min-height: 96px; padding: 16px 12px;
  border-radius: 18px; cursor: pointer; background: var(--surface);
  border: 1.5px solid var(--line); box-shadow: var(--shadow-s);
  transition: transform .12s ease, border-color .15s, background .15s;
}
.opt:hover { border-color: var(--accent-line); }
.opt:active { transform: scale(.98); }
.opt.selected { background: var(--accent-soft); border: 2px solid var(--accent-2); box-shadow: var(--shadow-accent); }
.opt .check {
  position: absolute; top: 8px; right: 8px; border-radius: 50%; background: var(--grad);
  display: flex; align-items: center; justify-content: center;
}
.opt .check i {
  display: block; width: 8px; height: 4.5px; border-left: 2px solid var(--accent-ink);
  border-bottom: 2px solid var(--accent-ink); transform: rotate(-45deg) translateY(-1px);
}
.opt .opt-emoji { font-size: 27px; line-height: 1; }
.opt .opt-name { font-size: 13.5px; font-weight: 700; color: var(--ink-2); line-height: 1.25; }
.opt.selected .opt-name { color: var(--accent); font-weight: 800; }
.opt .opt-sub { font-size: 11.5px; font-weight: 600; color: var(--muted-3); margin-top: -4px; }

.row-opt {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 16px;
  border-radius: 16px; cursor: pointer; text-align: left; background: var(--surface);
  border: 1.5px solid var(--line); box-shadow: var(--shadow-s);
  font-size: 15.5px; font-weight: 600; color: var(--ink-2);
  transition: transform .12s ease, border-color .15s;
}
.row-opt:hover { border-color: var(--accent-line); }
.row-opt.selected { background: var(--accent-soft); border: 2px solid var(--accent-2); color: var(--accent); font-weight: 800; }
.row-opt .check-round {
  flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--surface-3);
  border: 1.5px solid var(--line-2); display: flex; align-items: center; justify-content: center; margin-left: auto;
}
.row-opt.selected .check-round { background: var(--grad); border: none; }
.row-opt .check-round i {
  display: block; width: 9px; height: 5px; border-left: 2px solid var(--accent-ink);
  border-bottom: 2px solid var(--accent-ink); transform: rotate(-45deg) translateY(-1px); opacity: 0;
}
.row-opt.selected .check-round i { opacity: 1; }

.toggle {
  width: 52px; height: 31px; padding: 3px; border-radius: 999px; border: none;
  background: var(--line-2); cursor: pointer; display: flex; flex: none;
  justify-content: flex-start; transition: background .18s;
}
.toggle.on { background: var(--grad); justify-content: flex-end; }
.toggle span { width: 25px; height: 25px; border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,.25); }

.pill-row { display: flex; gap: 3px; background: var(--surface-3); border-radius: 999px; padding: 4px; }
.pill {
  flex: 1; padding: 11px 6px; border-radius: 999px; border: none; background: transparent;
  font-size: 12px; font-weight: 700; color: var(--muted-2); cursor: pointer; transition: background .15s;
}
.pill.on { background: var(--surface); color: var(--accent); font-weight: 900; box-shadow: var(--shadow-s); }

.seg-btn {
  flex: 1; text-align: center; padding: 13px 6px; border-radius: 14px;
  border: 1.5px solid var(--line); background: var(--surface);
  font-size: 14.5px; font-weight: 800; color: var(--muted); cursor: pointer;
}
.seg-btn.on { background: var(--grad); border-color: transparent; color: var(--accent-ink); box-shadow: var(--shadow-accent); }

.chip {
  display: inline-flex; align-items: center; gap: 8px; padding: 9px 13px; border-radius: 999px;
  border: none; background: var(--grad); font-size: 14px; font-weight: 800;
  color: var(--accent-ink); cursor: pointer;
}

/* ── Счётчики ────────────────────────────────────────────────────────── */
.counter { display: flex; align-items: center; justify-content: center; gap: 24px; }
.counter .round {
  width: 54px; height: 54px; border-radius: 50%; border: none; background: var(--surface-3);
  color: var(--muted-3); cursor: default; position: relative; flex: none;
}
.counter .round.on { background: var(--accent-soft-2); color: var(--accent); cursor: pointer; }
.counter .round b {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 15px; height: 2.5px; border-radius: 2px; background: currentColor;
}
.counter .round.plus b:last-child { transform: translate(-50%, -50%) rotate(90deg); }
.counter .value {
  font-size: 50px; font-weight: 900; letter-spacing: -2px; color: var(--accent);
  min-width: 46px; text-align: center; font-variant-numeric: tabular-nums;
}

.mini-step { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-3); border-radius: 11px; padding: 4px; }
.mini-step button {
  width: 28px; height: 26px; border-radius: 8px; border: none; background: var(--surface);
  font-size: 16px; font-weight: 800; color: var(--muted); cursor: pointer; line-height: 1;
}
.mini-step button[disabled] { color: var(--muted-3); opacity: .5; cursor: default; }
.mini-step span { font-size: 13.5px; font-weight: 800; color: var(--accent); min-width: 48px; text-align: center; }

/* ── Подсказки ───────────────────────────────────────────────────────── */
.note {
  display: flex; align-items: flex-start; gap: 12px; background: var(--surface-3);
  border-radius: 14px; padding: 14px 16px; border: 1px solid var(--line-3);
}
.note .emoji { font-size: 19px; flex: none; line-height: 1.3; }
.note .note-title { font-size: 14.5px; font-weight: 800; margin-bottom: 3px; }
.note .note-text { font-size: 13.5px; font-weight: 500; line-height: 1.5; color: var(--muted); }

.callout {
  display: flex; align-items: flex-start; gap: 12px; border-radius: 14px; padding: 15px 16px;
  background: var(--warn-bg); border: 1px solid var(--warn-line);
}
.callout.ok { background: var(--ok-bg); border-color: var(--ok-line); }
.callout .emoji { font-size: 18px; flex: none; line-height: 1.3; }
.callout .callout-title { font-size: 14.5px; font-weight: 800; margin-bottom: 3px; color: var(--warn); }
.callout.ok .callout-title { color: var(--ok); }
.callout .callout-text { font-size: 13px; font-weight: 500; line-height: 1.5; color: var(--muted); }

/* ── Интро ───────────────────────────────────────────────────────────── */
.intro { padding-top: 8px; }
.intro-badge {
  display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent); font-size: 12.5px; font-weight: 800;
  border: 1px solid var(--accent-line); margin-bottom: 18px;
}
.intro h1 {
  margin: 0 0 14px; font-size: clamp(28px, 6vw, 46px); font-weight: 900;
  line-height: 1.06; letter-spacing: -1.4px;
}
.intro h1 em {
  font-style: normal;
  background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
}
.intro .lead { margin: 0 0 26px; font-size: clamp(15px, 1.9vw, 17.5px); font-weight: 500; line-height: 1.5; color: var(--muted); max-width: 46ch; }
.intro-features { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 8px; }
@media (min-width: 700px) { .intro-features { grid-template-columns: 1fr 1fr; } }
.feature {
  display: flex; gap: 13px; align-items: flex-start; padding: 16px; border-radius: 16px;
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-s);
}
.feature .ic {
  width: 38px; height: 38px; border-radius: 12px; background: var(--grad-soft); flex: none;
  display: flex; align-items: center; justify-content: center; font-size: 19px;
}
.feature .ft { font-size: 14.5px; font-weight: 800; line-height: 1.25; }
.feature .fd { font-size: 12.5px; font-weight: 500; line-height: 1.45; color: var(--muted-2); margin-top: 4px; }
.intro-stats { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 22px; }
.intro-stat { font-size: 13px; font-weight: 700; color: var(--muted-2); }
.intro-stat b { color: var(--accent); font-weight: 900; }

/* ── Бюджет ──────────────────────────────────────────────────────────── */
.budget-value {
  display: flex; align-items: baseline; justify-content: center; gap: 6px;
  font-size: clamp(38px, 8vw, 56px); font-weight: 900; letter-spacing: -2px; color: var(--accent);
  max-width: 100%;
}
.budget-value input {
  border: none; background: transparent; padding: 0; margin: 0; outline: none;
  text-align: right; font: inherit; letter-spacing: inherit; color: inherit;
  caret-color: var(--accent); border-bottom: 2px dashed var(--accent-line);
  font-variant-numeric: tabular-nums;
}
.range { position: relative; height: 46px; display: flex; align-items: center; touch-action: pan-y; cursor: pointer; }
.range .track { position: relative; width: 100%; height: 10px; border-radius: 999px; background: var(--line-2); }
.range .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--grad); }
.range .knob {
  position: absolute; top: 50%; transform: translate(-50%, -50%); width: 30px; height: 30px;
  border-radius: 50%; background: var(--surface); border: 4px solid var(--accent-2);
  box-shadow: var(--shadow-accent);
}
.range-legend { display: flex; justify-content: space-between; align-items: flex-start; margin-top: 4px; margin-bottom: 16px; }
.range-legend span { font-size: 12.5px; font-weight: 700; color: var(--muted-3); }
.range-legend small { display: block; font-size: 11.5px; font-weight: 600; color: var(--muted-3); margin-top: 2px; opacity: .85; }

/* ── Любимые продукты ────────────────────────────────────────────────── */
.cat-tabs {
  display: flex; gap: 6px; overflow-x: auto; margin: 0 -20px; padding: 2px 20px 12px;
  scrollbar-width: none;
}
.cat-tabs::-webkit-scrollbar { display: none; }
.cat-tab {
  flex: none; display: flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px;
  border: 1.5px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 700;
  color: var(--muted); cursor: pointer; position: relative; white-space: nowrap;
  transition: border-color .15s;
}
.cat-tab:hover { border-color: var(--accent-line); }
.cat-tab.on { background: var(--grad); border-color: transparent; color: var(--accent-ink); box-shadow: var(--shadow-accent); }
.cat-tab .cat-dot {
  position: absolute; top: 4px; right: 6px; width: 7px; height: 7px; border-radius: 50%;
  background: var(--ok); box-shadow: 0 0 0 2px var(--surface);
}
.cat-tab.on .cat-dot { background: var(--accent-ink); box-shadow: 0 0 0 2px rgba(255,255,255,.4); }

.prod-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 700px) { .prod-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.prod-card {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px;
  min-height: 94px; padding: 12px 6px 10px; border-radius: 16px; cursor: pointer;
  background: var(--surface); border: 1.5px solid var(--line); box-shadow: var(--shadow-s);
  transition: transform .12s ease, border-color .15s, background .15s;
}
.prod-card:hover { border-color: var(--accent-line); }
.prod-card:active { transform: scale(.97); }
.prod-card.selected { background: var(--accent-soft); border: 2px solid var(--accent-2); box-shadow: var(--shadow-accent); }
.prod-card .check {
  position: absolute; top: 6px; right: 6px; border-radius: 50%; background: var(--grad);
  display: flex; align-items: center; justify-content: center;
}
.prod-card .check i {
  display: block; width: 7px; height: 4px; border-left: 2px solid var(--accent-ink);
  border-bottom: 2px solid var(--accent-ink); transform: rotate(-45deg) translateY(-1px);
}
.prod-card .prod-emoji { font-size: 25px; line-height: 1.1; }
.prod-card .prod-name { font-size: 11.5px; font-weight: 700; line-height: 1.2; color: var(--ink-2); text-align: center; }
.prod-card.selected .prod-name { color: var(--accent); }
.prod-card .prod-kcal { font-size: 10px; font-weight: 600; color: var(--muted-3); }
.prod-hint { text-align: center; font-size: 13px; font-weight: 700; color: var(--muted-2); line-height: 1.4; }

/* ── Анализ ──────────────────────────────────────────────────────────── */
.analyze { display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 4dvh; }
.analyze .orb {
  position: relative; width: 92px; height: 92px; border-radius: 30px; background: var(--grad);
  display: flex; align-items: center; justify-content: center; font-size: 40px;
  box-shadow: var(--shadow-accent); margin-bottom: 26px;
}
.analyze .orb::before {
  content: ''; position: absolute; inset: -22px; border-radius: 50%;
  background: radial-gradient(circle, var(--accent-soft-2), transparent 68%);
  animation: glow 2.2s ease-in-out infinite; z-index: -1;
}
.analyze h1 { margin: 0 0 8px; font-size: 24px; font-weight: 900; }
.analyze p { margin: 0 0 22px; font-size: 14.5px; font-weight: 500; color: var(--muted); }
.percent { font-size: 32px; font-weight: 900; letter-spacing: -1.2px; color: var(--accent); text-align: center; margin-bottom: 10px; font-variant-numeric: tabular-nums; }
.track-wide { height: 7px; border-radius: 999px; background: var(--line-2); overflow: hidden; }
.track-wide i { display: block; height: 100%; border-radius: 999px; background: var(--grad); transition: width .4s ease; }

.checks { width: 100%; text-align: left; padding: 4px 16px; }
.check-row { display: flex; align-items: center; gap: 12px; padding: 14px 0; }
.check-row + .check-row { border-top: 1px solid var(--line-3); }
.check-row .dot {
  flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--surface-3);
  display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900;
  color: var(--accent-ink);
}
.check-row.done .dot { background: var(--grad); }
.check-row.now .dot { background: transparent; border: 2.5px dashed var(--accent-2); animation: spin 2.4s linear infinite; }
.check-row span.text { font-size: 14.5px; font-weight: 600; color: var(--muted-3); }
.check-row.done span.text { font-weight: 800; color: var(--ink); }
.check-row.now span.text { font-weight: 800; color: var(--accent); }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes glow { 0%, 100% { transform: scale(1); opacity: .5; } 50% { transform: scale(1.08); opacity: .85; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.fade-up { animation: fadeUp .25s ease-out; }

/* ── Результат ───────────────────────────────────────────────────────── */
.result-head { padding: 6px 0 4px; }
.result-head .kicker { font-size: 11.5px; font-weight: 800; letter-spacing: .16em; color: var(--accent); }
.result-head h1 { margin: 10px 0 8px; font-size: clamp(24px, 4vw, 34px); font-weight: 900; letter-spacing: -.8px; }
.result-head p { margin: 0; font-size: 14.5px; font-weight: 500; color: var(--muted); }

.kpi-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 15px 16px; box-shadow: var(--shadow-s); }
.kpi .kpi-label { font-size: 10.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted-3); }
.kpi .kpi-value { font-size: 26px; font-weight: 900; letter-spacing: -1px; color: var(--accent); margin-top: 5px; font-variant-numeric: tabular-nums; }
.kpi .kpi-sub { font-size: 12.5px; font-weight: 600; color: var(--muted-2); margin-top: 3px; }
.kpi.wide { grid-column: span 2; }

.macros {
  display: flex; margin-top: 12px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 18px; padding: 14px 8px; box-shadow: var(--shadow-s);
}
.macro { flex: 1; text-align: center; }
.macro + .macro { border-left: 1px solid var(--line-3); }
.macro .num { font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; }
.macro .cap { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-3); margin-top: 4px; }
.macro .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

.section { margin-top: 30px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.section-head h2 { margin: 0; font-size: clamp(18px, 2.4vw, 21px); font-weight: 900; letter-spacing: -.4px; }
.section-head .meta { font-size: 12.5px; font-weight: 700; color: var(--muted-3); white-space: nowrap; }
.section-note { font-size: 13.5px; font-weight: 500; color: var(--muted-2); margin: -6px 0 12px; line-height: 1.5; }

.day-nav {
  display: flex; gap: 6px; overflow-x: auto; margin: 0 -20px 14px; padding: 2px 20px 8px;
  scrollbar-width: none; position: sticky; top: 64px; z-index: 10;
  background: linear-gradient(180deg, var(--bg) 70%, transparent);
}
.day-nav::-webkit-scrollbar { display: none; }
.day-tab {
  flex: none; min-width: 60px; padding: 9px 12px; border-radius: 14px; border: 1.5px solid var(--line);
  background: var(--surface); font-size: 13.5px; font-weight: 800; color: var(--muted-2);
  cursor: pointer; text-align: center; box-shadow: var(--shadow-s);
}
.day-tab small { display: block; font-size: 10.5px; font-weight: 700; color: var(--muted-3); margin-top: 3px; font-variant-numeric: tabular-nums; }
.day-tab.on { background: var(--grad); border-color: transparent; color: var(--accent-ink); box-shadow: var(--shadow-accent); }
.day-tab.on small { color: rgba(35, 28, 21, .72); }

.meal-row {
  display: flex; gap: 10px; align-items: center; background: var(--surface);
  border: 1px solid var(--line); border-radius: 15px; padding: 12px 10px 12px 12px;
  box-shadow: var(--shadow-s);
}
.meal-row + .meal-row { margin-top: 8px; }
.meal-row .tag {
  font-size: 10.5px; font-weight: 800; color: var(--accent); background: var(--accent-soft);
  border-radius: 8px; padding: 4px 7px; min-width: 62px; text-align: center; flex: none;
}
.meal-row .dish { font-size: 14.5px; font-weight: 800; line-height: 1.3; }
.meal-row .dish-meta { font-size: 12px; font-weight: 600; color: var(--muted-3); margin-top: 3px; }
.meal-row .kcal { font-size: 13.5px; font-weight: 800; color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }
.badge-mode { display: inline-block; font-size: 10.5px; font-weight: 800; border-radius: 999px; padding: 2px 8px; }
.badge-cook { background: var(--accent-soft-2); color: var(--accent); }
.badge-warm { background: var(--surface-3); color: var(--muted); }
.badge-fam { background: var(--ok-bg); color: var(--ok); }

.totals {
  display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: space-between;
  margin-top: 12px; padding: 12px 15px; background: var(--surface-3); border-radius: 14px;
  font-size: 13px; font-weight: 700; color: var(--muted);
}

.recipe { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); overflow: hidden; box-shadow: var(--shadow-s); }
.recipe + .recipe { margin-top: 8px; }
.recipe-head { display: flex; gap: 12px; align-items: center; padding: 11px; cursor: pointer; width: 100%; border: none; background: transparent; text-align: left; }
.recipe-head img { width: 56px; height: 56px; border-radius: 13px; flex: none; }
.recipe-head .rt { font-size: 14.5px; font-weight: 800; line-height: 1.25; }
.recipe-head .rs { font-size: 12px; font-weight: 600; color: var(--muted-3); margin-top: 3px; }
.recipe-head .chev-down {
  margin-left: auto; flex: none; width: 8px; height: 8px;
  border-right: 2.5px solid var(--muted-3); border-bottom: 2.5px solid var(--muted-3);
  transform: rotate(45deg); transition: transform .18s;
}
.recipe.open .recipe-head .chev-down { transform: rotate(-135deg); }
.recipe-body { padding: 0 14px 14px; animation: fadeUp .2s ease-out; }
.recipe-cols { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 620px) { .recipe-cols { grid-template-columns: 1fr 1fr; } }
.ing-list { list-style: none; margin: 0; padding: 0; }
.ing-list li {
  display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 600;
  color: var(--muted); padding: 5px 0; border-bottom: 1px dashed var(--line-3);
}
.ing-list li b { color: var(--ink-2); font-weight: 800; white-space: nowrap; }
.steps { list-style: none; margin: 0; padding: 0; counter-reset: step; }
.steps li {
  position: relative; padding: 3px 0 9px 26px; font-size: 13px; font-weight: 500;
  line-height: 1.5; color: var(--muted); counter-increment: step;
}
.steps li::before {
  content: counter(step); position: absolute; left: 0; top: 2px; width: 18px; height: 18px;
  border-radius: 50%; background: var(--accent-soft); color: var(--accent);
  font-size: 10.5px; font-weight: 900; display: flex; align-items: center; justify-content: center;
}
.nutri-line { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.nutri-line b { color: var(--ink-2); }
.alt-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.alt-chip {
  border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 999px;
  padding: 6px 11px; font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer;
}
.alt-chip:hover { border-color: var(--accent-line); color: var(--accent); }

.shop-group + .shop-group { margin-top: 14px; }
.shop-group .aisle { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; color: var(--muted); margin-bottom: 7px; }
.shop-group .aisle .sum { margin-left: auto; font-size: 12.5px; color: var(--muted-3); font-variant-numeric: tabular-nums; }
.shop-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 13px; width: 100%; text-align: left; cursor: pointer;
}
.shop-item + .shop-item { margin-top: 6px; }
.shop-item .nm { font-size: 13.5px; font-weight: 700; }
.shop-item .qt { font-size: 12px; font-weight: 600; color: var(--muted-3); }
.shop-item .pr { margin-left: auto; font-size: 13.5px; font-weight: 800; color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }
.shop-item .nt { font-size: 10.5px; font-weight: 700; color: var(--warn); background: var(--warn-bg); border-radius: 6px; padding: 2px 6px; }
.shop-item.done .nm { text-decoration: line-through; color: var(--muted-3); }
.shop-total {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin-top: 14px; padding: 16px 18px; border-radius: 18px;
  background: var(--grad); color: var(--accent-ink); box-shadow: var(--shadow-accent);
}
.shop-total .lbl { font-size: 13px; font-weight: 800; }
.shop-total .val { font-size: 24px; font-weight: 900; letter-spacing: -.8px; font-variant-numeric: tabular-nums; }

.training { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.train-day { text-align: center; }
.train-day .cap { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--muted-3); margin-bottom: 5px; }
.train-day .cell {
  aspect-ratio: 1; border-radius: 11px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px; font-size: 15px;
}
.train-day .cell span { font-size: 8.5px; font-weight: 900; text-transform: uppercase; }
.train-list { margin-top: 16px; }
.train-item { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-top: 1px solid var(--line-3); }
.train-item:first-child { border-top: none; }
.train-item .day { font-size: 12px; font-weight: 900; color: var(--accent); min-width: 24px; }
.train-item .tt { font-size: 14px; font-weight: 800; }
.train-item .td { font-size: 12.5px; font-weight: 500; color: var(--muted-2); margin-top: 3px; line-height: 1.45; }
.train-item .tk { margin-left: auto; font-size: 12px; font-weight: 800; color: var(--muted-3); white-space: nowrap; font-variant-numeric: tabular-nums; }

.action {
  display: flex; gap: 12px; align-items: flex-start; padding: 15px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 15px; box-shadow: var(--shadow-s);
}
.action + .action { margin-top: 8px; }
.action .emoji { font-size: 18px; flex: none; line-height: 1.3; }
.action .at { font-size: 14px; font-weight: 800; }
.action .ad { font-size: 13px; font-weight: 500; line-height: 1.5; color: var(--muted); margin-top: 3px; }

.fav-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.fav-chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px; border-radius: 999px;
  background: var(--accent-soft); border: 1px solid var(--accent-line);
  font-size: 12.5px; font-weight: 700; color: var(--accent);
}

.footer-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
.footer-actions .btn { flex: 1 1 200px; padding: 16px; font-size: 15.5px; }
.footer-note { margin: 18px 0 8px; font-size: 12px; font-weight: 500; line-height: 1.6; color: var(--muted-3); }

/* ── Боковая панель результата ───────────────────────────────────────── */
.side-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 18px; box-shadow: var(--shadow-s); margin-bottom: 12px;
}
.side-card .row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 7px 0; }
.side-card .row + .row { border-top: 1px solid var(--line-3); }
.side-card .k { font-size: 12.5px; font-weight: 600; color: var(--muted-2); }
.side-card .v { font-size: 15px; font-weight: 900; font-variant-numeric: tabular-nums; }
.side-title { font-size: 11.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted-3); margin-bottom: 10px; }
.side-nav { display: flex; flex-direction: column; gap: 2px; margin-top: 14px; }
.side-nav a {
  display: block; padding: 7px 10px; border-radius: 10px; font-size: 13px; font-weight: 600;
  color: var(--muted); text-decoration: none;
}
.side-nav a:hover { background: var(--surface-3); color: var(--ink-2); }

/* ── Тост ────────────────────────────────────────────────────────────── */
.toast {
  position: fixed; left: 50%; bottom: 104px; transform: translateX(-50%);
  background: var(--ink); color: var(--bg); border-radius: 13px; padding: 12px 18px;
  font-size: 13.5px; font-weight: 700; z-index: 60; animation: fadeUp .2s ease-out;
  max-width: min(92vw, 460px); text-align: center; box-shadow: var(--shadow-l);
}
@media (min-width: 1000px) { .toast { bottom: 40px; } }

/* ── Печать ──────────────────────────────────────────────────────────── */
@media print {
  html[data-theme] { --bg: #fff; --surface: #fff; --ink: #000; }
  .cta-dock, .day-nav, .footer-actions, .toast, .topbar, .shell-side, .no-print { display: none !important; }
  .app, body { background: #fff !important; }
  .shell { display: block; max-width: none; padding: 0; }
  .shell-body { max-width: none; padding: 0; }
  .recipe-body { display: block !important; }
  .print-all-days { display: block !important; }
  .card, .recipe, .kpi, .shop-item, .day-tab, .meal-row, .train-item { break-inside: avoid; }
}

</style>
</head>

function p(id, name, type, price, kcal, prot, fat, carb, opts = {}) {

    name,
    type,
    price,
    kcal,

    if (opts[tag]) o[tag] = true;
  }
  if (opts.dislike) o.dislike = opts.dislike;

  almond: ['#E0C79A', '#BCA075'],
  peanut: ['#D9B98A', '#B4966A'],
  seeds: ['#CBBE9E', '#A89A78'],
  sesame: ['#EFE3C4', '#D2C4A0'],
  honey: ['#E8B54E', '#C6912E'],
  jam: ['#C4506A', '#9E3450'],
  coconut: ['#FBF7EF', '#E0D8C8'],
  chickpea_dark: ['#C4A45E', '#A4843E'],
  oil: ['#EFC96A', '#CFA53A'],
  oliveoil: ['#D8C25E', '#B6A038'],
};

/** Настроение рисунка: plate (второе), bowl (суп), stack (оладьи/каша), drink (смузи), egg (яйца). */
const MOODS = {
  soup: ['borsch', 'shchi', 'soup_meatball', 'soup_pea', 'ukha', 'soup_mush', 'soup_lentil', 'soup_pumpkin', 'soup_chicken_noodle', 'soup_buckwheat', 'solyanka', 'okroshka', 'chicken_veg_soup_d'],
  stack: ['pancake_banana', 'pancake_berry', 'syrniki', 'draniki', 'oat_banana', 'oat_apple', 'oat_berry', 'oat_curd', 'buckwheat_milk', 'rice_pudding', 'millet_pumpkin', 'quinoa_porridge', 'zapekanka', 'curd_casserole_carrot', 'cottage_bake_d', 'cottage_veg', 'tvorog_smoothie'],
  drink: ['smoothie_bowl', 'smoothie_linen'],
  egg: ['oml_classic', 'oml_spinach', 'oml_mush', 'scr_avocado', 'shakshuka', 'omelet_roll', 'egg_veg_plate', 'egg_muffins', 'omelet_dinner', 'toast_egg', 'avocado_toast'],
  salad: ['salad_chicken', 'salad_salmon', 'shrimp_salad', 'salad_tuna', 'snack_veg_hummus', 'seaweed', 'snack_apple_curd'],
  sandwich: ['sandwich_turkey', 'sandwich_salmon', 'toast_cheese', 'lavash_breakfast', 'snack_cheese_bread', 'fish_tacos'],
};

function moodOf(recipe) {
  for (const [mood, ids] of Object.entries(MOODS)) if (ids.includes(recipe.id)) return mood;
  return 'plate';
}

const PROTEIN_IDS = [
  'chicken', 'chicken_f', 'turkey', 'beef', 'pork', 'mince', 'cod', 'pollock', 'salmon',
  'pink', 'mackerel', 'herring', 'shrimp', 'squid', 'tofu', 'liver', 'sausage', 'egg',
];

function mainIngredient(recipe) {
  // Берём самый «характерный» продукт: сначала белок, потом крупу, потом овощ.
  const skip = new Set(['oil', 'oliveoil', 'greens', 'butter', 'sugar', 'honey', 'veg_stock', 'sesame', 'seeds', 'milk', 'cream', 'sourcream', 'yogurt', 'kefir', 'curd', 'curd0']);
  for (const want of [PROTEIN_IDS, [...GRAIN_IDS], null]) {
    for (const [id] of recipe.items) {
      if (skip.has(id)) continue;
      if (!want || want.includes(id)) return id;
    }
  }
  return recipe.items[0]?.[0] || 'rice';
}

/** Форма «основного» куска: котлета, филе или ломтик. */
function mainPiece(cx, cy, rx, ry, rot, colors, kind) {
  const path =
    kind === 'cutlet'
      ? `M ${cx - rx} ${cy - ry * 0.1} q ${rx * 0.1} ${-ry * 1.25} ${rx * 0.75} ${-ry * 0.95}
         q ${rx * 0.75} ${-ry * 0.25} ${rx * 0.85} ${ry * 0.35}
         q ${rx * 0.15} ${ry * 0.9} ${-rx * 0.6} ${ry * 1.0}
         q ${-rx * 0.9} ${ry * 0.2} ${-rx} ${-ry * 0.4} z`
      : kind === 'fillet'
      ? `M ${cx - rx} ${cy + ry * 0.5} q ${rx * 0.35} ${-ry * 1.3} ${rx * 1.1} ${-ry * 1.05}
         q ${rx * 0.9} ${ry * 0.25} ${rx * 0.85} ${ry * 1.0}
         q ${-rx * 0.95} ${ry * 0.35} ${-rx * 1.95} ${-ry * 0.45} z`
      : `M ${cx - rx} ${cy} q ${rx * 0.2} ${-ry * 1.15} ${rx} ${-ry}
         q ${rx * 0.85} ${ry * 0.15} ${rx} ${ry}
         q ${-rx * 0.2} ${ry * 1.05} ${-rx} ${ry * 0.95}
         q ${-rx * 0.85} ${-ry * 0.1} ${-rx} ${-ry * 0.95} z`;
  return `<g transform="rotate(${rot} ${cx} ${cy})">
    <path d="${path}" transform="translate(0 ${ry * 0.16})" fill="${colors[1]}" opacity=".5"/>
    <path d="${path}" fill="${colors[0]}" stroke="${colors[1]}" stroke-width="${Math.max(1.2, ry * 0.09)}"/>
    <path d="M ${cx - rx * 0.5} ${cy - ry * 0.35} q ${rx * 0.4} ${-ry * 0.35} ${rx * 0.85} ${-ry * 0.2}"
      stroke="#FFFFFF" stroke-opacity=".38" stroke-width="${ry * 0.26}" fill="none" stroke-linecap="round"/>
  </g>`;
}

function hash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function ingredientColor(id) {
  return ING[id] || ['#D8B98A', '#B29566'];
}

function accent(recipe) {
  for (const [id] of recipe.items) {
    if (ING[id]) return ING[id][0];
  }
  return '#E8B54E';
}

const GRAIN_IDS = new Set([
  'buckwheat', 'rice', 'brown_rice', 'oats', 'millet', 'pasta', 'noodles', 'couscous',
  'bulgur', 'quinoa', 'flour_oats', 'flour_wheat',
]);

/** Кусочек еды: выпуклая форма с бликом и тенью. */
function chunk(cx, cy, rx, ry, rot, colors, opacity = 1) {
  return `<g transform="rotate(${rot} ${cx} ${cy})" opacity="${opacity}">
    <ellipse cx="${cx}" cy="${cy + ry * 0.18}" rx="${rx}" ry="${ry}" fill="${colors[1]}" opacity=".55"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${colors[0]}"/>
    <ellipse cx="${cx - rx * 0.3}" cy="${cy - ry * 0.35}" rx="${rx * 0.42}" ry="${ry * 0.3}" fill="#FFFFFF" opacity=".28"/>
  </g>`;
}

/** Листик зелени. */
function leaf(cx, cy, len, rot, color) {
  const w = len * 0.42;
  return `<path d="M ${cx} ${cy} q ${len * 0.42} ${-w} ${len} 0 q ${-len * 0.42} ${w} ${-len} 0 z"
    fill="${color}" transform="rotate(${rot} ${cx} ${cy})"/>
  <path d="M ${cx} ${cy} l ${len * 0.9} 0" stroke="#FFFFFF" stroke-opacity=".38" stroke-width="1.2" transform="rotate(${rot} ${cx} ${cy})"/>`;
}

/** Крупа/каша в тарелке: мелкие зёрна. */
function grains(cx, cy, rx, ry, color, count, seed) {
  let s = '';
  for (let i = 0; i < count; i++) {
    const a = ((seed * (i + 3)) % 97) / 97 * Math.PI * 2;
    const rr = (((seed * (i + 7)) % 89) / 89) * 0.85;
    const px = cx + Math.cos(a) * rx * rr;
    const py = cy + Math.sin(a) * ry * rr;
    s += `<ellipse cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" rx="${(rx * 0.1).toFixed(1)}" ry="${(ry * 0.09).toFixed(1)}" fill="${color}" opacity=".92"/>`;
  }
  return s;
}

/** Яичница: белок неправильной формы + желток. */
function friedEgg(cx, cy, r, yolk = '#F5B93A') {
  return `<g>
    <path d="M ${cx - r} ${cy} C ${cx - r * 1.05} ${cy - r * 0.85} ${cx - r * 0.4} ${cy - r * 1.1} ${cx + r * 0.1} ${cy - r * 0.95}
      C ${cx + r * 0.75} ${cy - r * 1.15} ${cx + r * 1.1} ${cy - r * 0.45} ${cx + r * 0.95} ${cy + r * 0.1}
      C ${cx + r * 1.15} ${cy + r * 0.75} ${cx + r * 0.45} ${cy + r * 1.05} ${cx - r * 0.1} ${cy + r * 0.92}
      C ${cx - r * 0.75} ${cy + r * 1.08} ${cx - r * 1.1} ${cy + r * 0.55} ${cx - r} ${cy} Z"
      fill="#FDF8EC" stroke="#EFE2CC" stroke-width="1.4"/>
    <circle cx="${cx + r * 0.1}" cy="${cy - r * 0.05}" r="${r * 0.38}" fill="${yolk}"/>
    <circle cx="${cx + r * 0.02}" cy="${cy - r * 0.18}" r="${r * 0.13}" fill="#FFE9A8" opacity=".75"/>
  </g>`;
}

function lemonSlice(cx, cy, r, rot) {
  return `
  <g transform="translate(${cx} ${cy}) rotate(${rot})">
    <circle r="${r}" fill="#F5D35C"/>
    <circle r="${r - 2.4}" fill="#FBEB9C"/>
    ${[0, 60, 120, 180, 240, 300]
      .map((a) => `<path d="M0 0 L${(r - 3) * Math.cos((a * Math.PI) / 180)} ${(r - 3) * Math.sin((a * Math.PI) / 180)}" stroke="#F0C33C" stroke-width="1.4" stroke-linecap="round"/>`)
      .join('')}
  </g>`;
}

function plateBase(size, inner) {
  const c = size / 2;
  return `
  <circle cx="${c}" cy="${c}" r="${size * 0.42}" fill="#FBF6EC"/>
  <circle cx="${c}" cy="${c}" r="${size * 0.42}" fill="none" stroke="#E6DAC8" stroke-width="1.5"/>
  <circle cx="${c}" cy="${c}" r="${size * 0.34}" fill="#FFFFFF" stroke="#EFE5D6" stroke-width="1.2"/>
  ${inner}
  <ellipse cx="${c}" cy="${c + size * 0.34}" rx="${size * 0.2}" ry="${size * 0.028}" fill="rgba(120,95,70,.10)"/>`;
}

function blob(cx, cy, rx, ry, rot, colors, opacity = 1) {
  return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${colors[0]}" transform="rotate(${rot} ${cx} ${cy})" opacity="${opacity}"/>
  <path d="M ${cx - rx * 0.7} ${cy + ry * 0.25} q ${rx * 0.7} ${ry * 0.9} ${rx * 1.4} 0" stroke="${colors[1]}" stroke-width="2" fill="none" opacity="${0.5 * opacity}" stroke-linecap="round"/>`;
}

/** Есть ли в блюде рыба: ей положен ломтик лимона. */
function pinkish(recipe) {
  return recipe.items.some(([id]) =>
    ['cod', 'pollock', 'salmon', 'pink', 'mackerel', 'herring', 'shrimp', 'squid'].includes(id)
  );
}

/** Каким куском рисовать белок: котлета, филе или ломтик. */
function pieceKind(id) {
  if (['mince', 'chicken_f', 'liver', 'sausage'].includes(id)) return 'cutlet';
  if (['cod', 'pollock', 'salmon', 'pink', 'mackerel', 'herring'].includes(id)) return 'fillet';
  return 'slice';
}

/** Собираем SVG-иллюстрацию блюда. */
function dishArt(recipe, size = 320) {
  const seed = hash(recipe.id);
  const rand = (n) => ((seed >> (n % 24)) % 1000) / 1000;
  const c = size / 2;
  const mood = moodOf(recipe);
  const main = mainIngredient(recipe);
  const mainColors = ingredientColor(main);
  const accentColor = accent(recipe);
  const greensId = recipe.items.some(([id]) => id === 'spinach' || id === 'greens' || id === 'lettuce' || id === 'cilantro') ? 'greens' : null;
  const greenColors = greensId ? ingredientColor(greensId) : ingredientColor('greens');

  let inner = '';

  if (mood === 'soup') {
    const broth = ingredientColor(
      recipe.id === 'borsch' ? 'beet'
        : recipe.id === 'soup_pumpkin' ? 'pumpkin'
        : recipe.id === 'soup_pea' ? 'greenpea'
        : recipe.id === 'soup_mush' ? 'mush'
        : recipe.id === 'soup_lentil' ? 'lentil'
        : 'carrot'
    );
    inner = `
      <circle cx="${c}" cy="${c}" r="${size * 0.365}" fill="#FFFFFF" stroke="#EFE5D6" stroke-width="1.2"/>
      <circle cx="${c}" cy="${c}" r="${size * 0.3}" fill="${broth[0]}"/>
      <circle cx="${c}" cy="${c}" r="${size * 0.3}" fill="url(#soupShade)"/>
      ${chunk(c - size * 0.09, c - size * 0.02, size * 0.055, size * 0.042, -16, ingredientColor('potato'))}
      ${chunk(c + size * 0.1, c + size * 0.05, size * 0.045, size * 0.032, 22, ingredientColor('carrot'))}
      ${chunk(c + size * 0.02, c - size * 0.12, size * 0.05, size * 0.03, 6, ingredientColor('beef'))}
      ${leaf(c - size * 0.14, c - size * 0.13, size * 0.1, -22, ingredientColor('greens')[0])}
      ${leaf(c + size * 0.06, c + size * 0.15, size * 0.08, 14, ingredientColor('greens')[0])}
      ${recipe.items.some(([id]) => id === 'sourcream' || id === 'cream')
        ? `<ellipse cx="${c + size * 0.04}" cy="${c + size * 0.01}" rx="${size * 0.07}" ry="${size * 0.045}" fill="#FDFAF2" opacity=".94"/>
           <ellipse cx="${c + size * 0.04}" cy="${c}" rx="${size * 0.035}" ry="${size * 0.022}" fill="#FFFFFF" opacity=".7"/>`
        : ''}
      <g opacity=".45" stroke="#CDBFA8" stroke-width="2.6" stroke-linecap="round" fill="none">
        <path d="M ${c - size * 0.1} ${c - size * 0.26} q ${size * 0.035} ${-size * 0.055} 0 ${-size * 0.11}"/>
        <path d="M ${c + size * 0.05} ${c - size * 0.28} q ${size * 0.04} ${-size * 0.06} 0 ${-size * 0.12}"/>
      </g>`;
  } else if (mood === 'drink') {
    const base = ingredientColor('frozen_berry')[0];
    inner = `
      <path d="M ${c - size * 0.19} ${c - size * 0.26} L ${c - size * 0.13} ${c + size * 0.24} Q ${c} ${c + size * 0.32} ${c + size * 0.13} ${c + size * 0.24} L ${c + size * 0.19} ${c - size * 0.26} Z" fill="#FBF7EF" opacity=".94" stroke="#E8DCC8" stroke-width="1.5"/>
      <path d="M ${c - size * 0.165} ${c - size * 0.09} L ${c - size * 0.128} ${c + size * 0.22} Q ${c} ${c + size * 0.29} ${c + size * 0.128} ${c + size * 0.22} L ${c + size * 0.165} ${c - size * 0.09} Z" fill="${base}"/>
      <ellipse cx="${c}" cy="${c - size * 0.09}" rx="${size * 0.165}" ry="${size * 0.036}" fill="#E8A6B4"/>
      ${chunk(c - size * 0.055, c + size * 0.04, size * 0.045, size * 0.032, -12, ingredientColor('banana'))}
      ${chunk(c + size * 0.06, c + size * 0.1, size * 0.035, size * 0.026, 18, ingredientColor('berries'))}
      <rect x="${c + size * 0.05}" y="${c - size * 0.31}" width="${size * 0.035}" height="${size * 0.26}" rx="${size * 0.017}" fill="#EFB6C0" transform="rotate(12 ${c + size * 0.06} ${c - size * 0.2})"/>
      ${leaf(c - size * 0.15, c - size * 0.2, size * 0.09, -32, ingredientColor('greens')[0])}`;
  } else if (mood === 'stack') {
    // Пиала с кашей или стопка оладий — по составу блюда.
    const grainy = recipe.items.some(([id]) => GRAIN_IDS.has(id)) && !/pancake|syrmiki|draniki|syrniki/.test(recipe.id);
    if (grainy) {
      const grainId = recipe.items.find(([id]) => GRAIN_IDS.has(id))[0];
      const g = ingredientColor(grainId);
      inner = `
        <circle cx="${c}" cy="${c}" r="${size * 0.365}" fill="#FFFFFF" stroke="#EFE5D6" stroke-width="1.2"/>
        <circle cx="${c}" cy="${c}" r="${size * 0.3}" fill="${g[0]}" opacity=".55"/>
        <circle cx="${c}" cy="${c}" r="${size * 0.3}" fill="url(#soupShade)"/>
        ${grains(c, c, size * 0.28, size * 0.22, g[1], 34, seed)}
        ${chunk(c - size * 0.1, c - size * 0.06, size * 0.05, size * 0.036, -18, ingredientColor(recipe.items.some(([id]) => id === 'banana') ? 'banana' : 'apple'))}
        ${chunk(c + size * 0.09, c + size * 0.04, size * 0.042, size * 0.03, 16, ingredientColor('berries'))}
        ${leaf(c - size * 0.14, c - size * 0.14, size * 0.08, -24, ingredientColor('greens')[0])}`;
    } else {
      const discs = 3;
      inner = Array.from({ length: discs }, (_, i) => {
        const y = c + size * 0.11 - i * size * 0.065;
        const w = size * (0.29 - i * 0.025);
        return `<ellipse cx="${c}" cy="${y}" rx="${w}" ry="${size * 0.052}" fill="${mainColors[1]}"/>
          <ellipse cx="${c}" cy="${y - size * 0.012}" rx="${w * 0.97}" ry="${size * 0.048}" fill="${mainColors[0]}"/>`;
      }).join('') + `
        <ellipse cx="${c}" cy="${c - size * 0.1}" rx="${size * 0.06}" ry="${size * 0.042}" fill="${ingredientColor('jam')[0]}"/>
        <ellipse cx="${c - size * 0.012}" cy="${c - size * 0.115}" rx="${size * 0.028}" ry="${size * 0.018}" fill="#FFFFFF" opacity=".45"/>
        ${chunk(c - size * 0.12, c - size * 0.09, size * 0.042, size * 0.034, -20, ingredientColor('berries'))}
        ${chunk(c + size * 0.11, c - size * 0.07, size * 0.038, size * 0.03, 14, ingredientColor('banana'))}
        ${leaf(c + size * 0.16, c - size * 0.18, size * 0.08, 26, ingredientColor('greens')[0])}`;
    }
  } else if (mood === 'egg') {
    inner = `
      ${friedEgg(c - size * 0.05, c + size * 0.01, size * 0.24)}
      ${recipe.items.some(([id]) => id === 'salmon')
        ? `<path d="M ${c + size * 0.03} ${c - size * 0.18} q ${size * 0.16} ${size * 0.05} ${size * 0.19} ${size * 0.12} q ${-size * 0.16} ${size * 0.03} ${-size * 0.19} ${-size * 0.02} z" fill="${ingredientColor('salmon')[0]}"/>
           <path d="M ${c + size * 0.06} ${c - size * 0.16} q ${size * 0.1} ${size * 0.03} ${size * 0.13} ${size * 0.08}" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="1.6" fill="none"/>`
        : ''}
      ${recipe.items.some(([id]) => id === 'tomato')
        ? `${chunk(c + size * 0.17, c + size * 0.13, size * 0.055, size * 0.042, 24, ingredientColor('tomato'))}
           ${chunk(c + size * 0.09, c + size * 0.19, size * 0.045, size * 0.034, -12, ingredientColor('tomato'))}`
        : ''}
      ${recipe.items.some(([id]) => id === 'cheese')
        ? `<path d="M ${c - size * 0.24} ${c + size * 0.16} l ${size * 0.11} ${-size * 0.02} l ${size * 0.015} ${size * 0.06} l ${-size * 0.11} ${size * 0.03} z" fill="${ingredientColor('cheese')[0]}"/>`
        : ''}
      ${recipe.items.some(([id]) => id === 'mush')
        ? `<path d="M ${c + size * 0.06} ${c + size * 0.2} a ${size * 0.06} ${size * 0.05} 0 0 1 ${size * 0.12} 0 z" fill="${ingredientColor('mush')[0]}"/>
           <rect x="${c + size * 0.1}" y="${c + size * 0.2}" width="${size * 0.04}" height="${size * 0.05}" fill="${ingredientColor('mush')[1]}" rx="2"/>`
        : ''}
      ${recipe.items.some(([id]) => id === 'spinach' || id === 'greens')
        ? `${leaf(c - size * 0.2, c - size * 0.12, size * 0.13, -156, ingredientColor('spinach')[0])}
           ${leaf(c - size * 0.13, c + size * 0.19, size * 0.11, 168, ingredientColor('spinach')[0])}`
        : ''}
      ${recipe.items.some(([id]) => id === 'bread' || id === 'lavash')
        ? `<path d="M ${c + size * 0.08} ${c + size * 0.26} l ${size * 0.2} ${-size * 0.05} l ${size * 0.025} ${size * 0.1} l ${-size * 0.2} ${size * 0.055} z" fill="${ingredientColor('bread')[0]}"/>
           <path d="M ${c + size * 0.1} ${c + size * 0.29} l ${size * 0.17} ${-size * 0.045}" stroke="${ingredientColor('bread')[1]}" stroke-width="1.6" fill="none"/>`
        : ''}
      ${recipe.items.some(([id]) => id === 'pepper')
        ? `<path d="M ${c - size * 0.22} ${c + size * 0.05} a ${size * 0.05} ${size * 0.075} 0 0 1 ${size * 0.09} ${size * 0.02} l ${-size * 0.02} ${size * 0.11} a ${size * 0.05} ${size * 0.05} 0 0 1 ${-size * 0.08} ${-size * 0.01} z" fill="${ingredientColor('pepper')[0]}"/>`
        : ''}`;
  } else if (mood === 'salad') {
    inner = `
      <circle cx="${c}" cy="${c}" r="${size * 0.03}" fill="rgba(255,255,255,0)"/>
      ${Array.from({ length: 6 }, (_, i) => {
        const a = (i / 6) * Math.PI * 2 + 0.4;
        return leaf(c + Math.cos(a) * size * 0.12 - size * 0.06, c + Math.sin(a) * size * 0.1 - size * 0.02, size * 0.2, (a * 180) / Math.PI + 30, i % 2 ? ingredientColor('lettuce')[0] : ingredientColor('spinach')[0]);
      }).join('')}
      ${recipe.items.slice(0, 5).map(([id], i) => {
        const a = (i / 5) * Math.PI * 2 - 0.6;
        return chunk(c + Math.cos(a) * size * 0.13, c + Math.sin(a) * size * 0.11, size * 0.058, size * 0.044, (seed + i * 37) % 90 - 45, ingredientColor(id));
      }).join('')}`;
  } else if (mood === 'sandwich') {
    inner = `
      <path d="M ${c - size * 0.235} ${c - size * 0.12} l ${size * 0.47} ${-size * 0.02} l ${-size * 0.02} ${-size * 0.15} l ${-size * 0.43} ${size * 0.01} z" fill="${ingredientColor('bread')[1]}"/>
      <path d="M ${c - size * 0.225} ${c - size * 0.05} l ${size * 0.45} ${-size * 0.015}" stroke="${greenColors[0]}" stroke-width="${size * 0.045}" stroke-linecap="round"/>
      <path d="M ${c - size * 0.23} ${c + size * 0.02} l ${size * 0.46} ${-size * 0.015}" stroke="${mainColors[0]}" stroke-width="${size * 0.05}" stroke-linecap="round"/>
      <path d="M ${c - size * 0.235} ${c + size * 0.09} l ${size * 0.47} ${-size * 0.015}" stroke="${ingredientColor('tomato')[0]}" stroke-width="${size * 0.04}" stroke-linecap="round"/>
      <path d="M ${c - size * 0.24} ${c + size * 0.14} l ${size * 0.48} ${-size * 0.02} l ${-size * 0.02} ${-size * 0.12} l ${-size * 0.44} ${size * 0.01} z" fill="${ingredientColor('bread')[0]}"/>
      <path d="M ${c - size * 0.2} ${c - size * 0.22} l ${size * 0.16} ${-size * 0.01}" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="2" fill="none"/>
      ${leaf(c + size * 0.16, c - size * 0.2, size * 0.09, 30, greenColors[0])}`;

      const eatPortions = (isFam ? scale : 1) * portionAdjust;

/**
 * Список покупок: складываем столько продукта, сколько реально съедят
 * (своя порция + порция на каждого, если блюдо общее).
 */
function buildShoppingList(days, prefs, factor = 1) {
  const totals = new Map();
  for (const day of days) {
    for (const m of day.meals) {
      // Покупаем ровно то, что уйдёт за неделю: партию в день готовки
      // либо порции на всех едоков в обычный день.
      const use = Math.max(m.cookPortions ?? m.portions, m.eatPortions) * factor;
      for (const [id, g] of m.recipe.items) {
        totals.set(id, (totals.get(id) || 0) + g * use);
      }
    }
  }

  const storeIds = prefs.stores.length ? prefs.stores : ['mag'];
  const index = storeIndex(storeIds);
  const unavailable = new Set();
  for (const s of STORES) {
    if (!storeIds.includes(s.id)) continue;
    for (const id of s.no || []) unavailable.add(id);
  }
  const multis = storeIds.length > 1;

  const items = [];
  let total = 0;
  let pantryCost = 0;
  for (const [id, grams] of totals) {
    const prod = BY_ID.get(id);
    if (!prod) continue;
    const rounded = roundPack(prod, grams, prefs.adults + prefs.kids.length);
    let price = (prod.price * rounded.buy) / 1000;
    const notEverywhere = unavailable.has(id);
    if (notEverywhere && multis) price *= 1.06; // придётся искать в другом магазине
    const isPantry = PANTRY.includes(id);
    if (isPantry) pantryCost += price;
    total += price;
    items.push({
      id,
      name: prod.name,
      type: prod.type,
      amount: rounded.amount,
      unit: rounded.unit,
      packs: rounded.packs,
      buy: rounded.buy,
      price: Math.round(price),
      pantry: isPantry,
      note: notEverywhere && multis ? 'не во всех выбранных магазинах' : undefined,
    });
  }
  items.sort((a, b) => b.price - a.price || a.name.localeCompare(b.name, 'ru'));

  const aisles = AISLES.map((a) => ({
    ...a,
    items: items.filter((i) => i.type === a.id && !i.pantry),
    sum: items.filter((i) => i.type === a.id && !i.pantry).reduce((s, i) => s + i.price, 0),
  })).filter((a) => a.items.length);

  return {
    items: items.filter((i) => !i.pantry),
    pantryItems: items.filter((i) => i.pantry),
    aisles,
    total: Math.round(total),
    pantryCost: Math.round(pantryCost),
    grossTotal: Math.round(total),

}

/** Округляем до реальной упаковки: яйца — десятками, крупы — по 100 г и т.п. */
function roundPack(prod, grams, people) {
  const g = Math.max(1, Math.ceil(grams));
  if (prod.unit === 'шт' && prod.unitG) {
    const count = Math.max(1, Math.round(g / prod.unitG));
    const packs = Math.max(1, Math.ceil(count / 10));
    return { amount: count, unit: 'шт', buy: packs * 10 * prod.unitG, packs };
  }
  if (g >= 1000) {
    const buy = Math.ceil(g / 100) * 100;
    return { amount: Math.round(buy / 10) * 10, unit: 'г', buy };
  }
  if (prod.type === 'other' && g < 120) {
    const buy = Math.ceil(g / 10) * 10;
    return { amount: buy, unit: 'г', buy };
  }
  const step = people > 2 ? 100 : 50;
  const buy = Math.max(step, Math.ceil(g / step) * step);
  return { amount: buy, unit: 'г', buy };
}

  return { factor, over: budget < baseCost * 0.55 };
}

/** Хватает ли меню на дневную норму; если нет — что включить. */

  const covered = p.famMeals.length ? Math.min(plan.ownDaily, plan.avgDaily) : plan.avgDaily;
  const ratio = covered / plan.kcal;
  const picked = [...p.meals, ...p.famMeals.map((f) => f.replace('fam-', ''))];
  const missing = MEALS.filter((m) => !picked.includes(m.id));
  if (ratio >= 0.92) {
    return { ok: true, text: `Меню закрывает ${Math.round(ratio * 100)}% дневной нормы — можно есть как есть.` };
  }
  const missingNames = missing.map((m) => m.name.toLowerCase()).join(', ');
  return {
    ok: false,
    ratio,
    missingNames,
    text: missing.length
      ? `Меню закрывает ${Math.round(ratio * 100)}% нормы: не отмечены ${missingNames}. Включите их на шаге «Сколько приёмов пищи» — рацион дотянется до ${plan.kcal} ккал.`

    addKcal: Math.max(0, plan.kcal - covered),

}

  return recipe.items.map(([id, g]) => {

    const amount =
      p?.unit === 'шт'
        ? `${Math.max(1, Math.round(grams / (p.unitG || 55)))} шт`
        : grams >= 1000
        ? `${(grams / 1000).toFixed(2).replace('.', ',')} кг`
        : `${grams} г`;
    return { id, name: p?.name || id, amount };
  });
}

function recipeSteps(recipe) {
  const items = recipe.items.map(([id, g]) => ({ p: BY_ID.get(id), g })).filter((x) => x.p);
  const main = items.find((x) => ['prot'].includes(x.p.type));
  const grain = items.find((x) => x.p.type === 'grain');
  const veg = items.filter((x) => x.p.type === 'veg');
  const dairy = items.find((x) => x.p.type === 'dairy' && ['cream', 'sourcream', 'milk', 'cheese', 'feta'].includes(x.id));
  const fat = items.find((x) => ['oil', 'oliveoil', 'butter'].includes(x.id));
  const spice = items.find((x) => x.p.type === 'other' && ['soysauce', 'tomato_paste', 'honey', 'sugar'].includes(x.id));
  const steps = [];

  const prep = [];
  if (main) prep.push(`нарезать ${main.p.name.toLowerCase()} (${main.g} г)`);
  veg.forEach((v) => prep.push(`${v.p.name.toLowerCase()} — ${v.g} г`));
  if (prep.length) steps.push(`Подготовить продукты: ${prep.join(', ')}.`);

  if (recipe.meal === 'breakfast' && items.some((x) => x.id === 'egg')) {
    steps.push('Взбить яйца с молоком, посолить. Разогреть сковороду с маслом.');
    steps.push('Вылить смесь и готовить под крышкой 3–5 минут, пока верх не схватится.');
  } else if (recipe.meal === 'lunch' && (recipe.tags.includes('суп') || items.some((x) => x.id === 'veg_stock'))) {
    steps.push('Довести бульон до кипения, заложить продукты по плотности: сначала картофель и крупы.');
    steps.push('Через 10 минут добавить овощи и зажарку, варить до готовности 15–20 минут.');
  } else if (grain && main) {
    steps.push(`Отварить ${grain.p.name.toLowerCase()} (${grain.g} г) до готовности.`);
    steps.push('Обжарить основу на среднем огне 7–8 минут, посолить.');
    steps.push(`Соединить с гарниром${dairy ? `, влить ${dairy.p.name.toLowerCase()}` : ''} и прогреть вместе 3 минуты.`);
  } else if (grain) {
    steps.push(`Отварить/распарить ${grain.p.name.toLowerCase()} (${grain.g} г).`);
    if (veg.length) steps.push('Овощи нарезать и потушить 8–10 минут до мягкости.');
    steps.push('Соединить всё, приправить и дать настояться 5 минут.');
  } else if (main) {
    steps.push('Разогреть сковороду, выложить основу и готовить по 5–6 минут с каждой стороны.');
    if (veg.length) steps.push('Овощи обжарить отдельно или запечь 15 минут при 190 °C.');
  } else {
    steps.push('Смешать продукты, заправить по вкусу.');
  }

  if (spice) steps.push(`Заправить ${spice.p.name.toLowerCase()} по вкусу.`);
  if (fat && !steps.some((s) => s.includes('масл'))) steps.push(`Добавить ${fat.p.name.toLowerCase()} — ${fat.g} г.`);
  steps.push('Подавать сразу; излишки остудить и убрать в холодильник на 2–3 дня.');
  return steps;
}

  /* ── 3. Бюджет ──────────────────────────────────────────────────────── */
  function Budget() {
    const peopleCount = state.adults + state.kids.length;
    const min = Math.max(1000, Math.round(estimateBaseWeeklyCost(state) / 50) * 50);
    const max = 30000;
    const comfortable = Math.min(max, Math.max(min, 250 * Math.ceil((1.2 * min) / 250)));
    const value = state.budget ?? comfortable;
    const perPerson = value / Math.max(1, peopleCount);
    const level = budgetLevel(perPerson);
    const step = 50;
    const percent = Math.max(0, Math.min(100, ((value - min) / Math.max(1, max - min)) * 100));
    const perPersonRound = Math.round(perPerson / step) * step;

    const setFromClient = (clientX, el) => {
      const rect = el.getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
      const snapped = Math.max(min, Math.min(max, Math.round((min + ratio * (max - min)) / step) * step));
      set({ budget: snapped });
    };

    return h(
      Screen,
      base({ progress: quizProgress('budget'), ctaLabel: 'Далее', onCta: () => go('sex') }),
      h(Title, { title: 'Бюджет на неделю', sub: 'Не будем предлагать то, что в него не влезет.' }),
      h(
        'div',
        { style: { textAlign: 'center', marginBottom: 16 } },
        h(
          'div',
          { className: 'budget-value' },
          h('input', {
            type: 'text',
            inputMode: 'numeric',
            'aria-label': 'Бюджет на неделю, ₽',
            value: String(value),
            onChange: (e) => {
              const digits = e.target.value.replace(/\D/g, '').slice(0, 6);
              set({ budget: digits ? Math.max(0, parseInt(digits, 10)) : null });
            },
            style: { width: `${Math.max(2, String(value).length + 1)}ch`, minWidth: 40 },
          }),
          h('span', { 'aria-hidden': true }, '₽')
        ),
        h('div', { style: { fontSize: 14, fontWeight: 600, color: 'var(--muted-2)', marginTop: 6 } },
          `≈ ${perPersonRound.toLocaleString('ru-RU')} ₽ на человека в неделю`)
      ),
      h(
        'div',
        { style: { textAlign: 'center', marginBottom: 14 } },
        h('div', { style: { fontSize: 19, fontWeight: 800 } }, level.name),
        h('div', { style: { fontSize: 14, fontWeight: 500, color: 'var(--muted-2)', marginTop: 3 } }, level.sub)
      ),
      h(
        'div',
        {
          className: 'range',
          onPointerDown: (e) => {
            if (!e.isPrimary) return;
            e.currentTarget.setPointerCapture?.(e.pointerId);
            setFromClient(e.clientX, e.currentTarget);
          },
          onPointerMove: (e) => {
            if (e.buttons) setFromClient(e.clientX, e.currentTarget);
          },
        },
        h(
          'div',
          { className: 'track' },
          h('div', { className: 'fill', style: { width: `${percent}%` } }),
          h('div', { className: 'knob', style: { left: `${percent}%` } })
        )
      ),
      h(
        'div',
        { className: 'range-legend' },
        h('span', null, `${min.toLocaleString('ru-RU')} ₽`, h('small', null, `минимум на ${peopleCount}`)),
        h('span', null, `${max.toLocaleString('ru-RU')} ₽+`)
      ),
      value < comfortable
        ? h(Callout, { kind: 'warn', emoji: '⚠️', title: 'Бюджет впритык' },
            `Уложимся, но выбор блюд сузится. На ${peopleCount} ${plural(peopleCount, 'человека', 'человек', 'человек')} комфортно от ${comfortable.toLocaleString('ru-RU')} ₽ в неделю.`)
        : h(Callout, { kind: 'ok', emoji: '✅', title: 'Хороший бюджет' },
            value > comfortable * 1.6
              ? 'Хватит с запасом — сможем добавить рыбу, фрукты и заготовки впрок.'
              : `Выйдет «${level.name.toLowerCase()}» корзина: ${level.sub.toLowerCase()}.`)
    );
  }

  /* ── 9. Анализ ──────────────────────────────────────────────────────── */
  const ANALYSIS_STEPS = ['Сверяем настройки', 'Подбираем блюда', 'Считаем корзину', 'Рацион готов'];

  function Calc() {
    const [stage, setStage] = React.useState(0);
    React.useEffect(() => {
      const timers = [900, 1800, 2700, 3500].map((ms, i) => setTimeout(() => setStage(i + 1), ms));
      return () => timers.forEach(clearTimeout);
    }, []);
    React.useEffect(() => {
      if (stage >= 4) {
        const t = setTimeout(() => ctx.finish(), 420);
        return () => clearTimeout(t);
      }
    }, [stage]);
    const percent = Math.round((Math.min(4, stage) / 4) * 100);
    return h(
      Screen,
      { theme, onToggleTheme: toggleTheme, onRestart: restart, showNav: false, bottomPad: 40, dock: null },
      h(
        'div',
        { className: 'analyze' },
        h('div', { className: 'orb' }, '🥗'),
        h('h1', null, stage >= 3 ? 'Почти готово…' : 'Собираем рацион…'),
        h('p', null, stage >= 3 ? 'Составляем список покупок' : 'Подбираем блюда под бюджет и продукты'),
        h(
          Card,
          { style: { width: '100%', textAlign: 'left', padding: '4px 16px' } },
          ANALYSIS_STEPS.map((label, i) =>
            h(
              'div',
              { key: label, className: 'check-row' + (stage > i ? ' done' : stage === i ? ' now' : '') },
              h('span', { className: 'dot' }, stage > i ? '✓' : ''),
              h('span', { className: 'text' }, label)
            )
          )
        ),
        h('div', { className: 'spacer-20' }),
        h('div', { style: { width: '100%' } }, h(WideTrack, { percent }))
      )
    );
  }

  /** Линейка со «щелчками» — для роста и веса. */
  function Ruler({ value, min, max, onChange, unit, valueSize = 62 }) {
    const drag = React.useRef(null);
    const [ghost, setGhost] = React.useState(null);
    const shown = ghost ?? value;
    const ticks = [];
    for (let v = Math.max(min, Math.floor(shown - 20)); v <= Math.min(max, Math.ceil(shown + 20)); v++) ticks.push(v);
    return h(
      'div',
      { style: { textAlign: 'center' } },
      h(
        'div',
        { style: { marginBottom: 20 } },
        h('span', { style: { fontSize: valueSize, fontWeight: 900, letterSpacing: '-2.4px', color: 'var(--accent)', lineHeight: 1, fontVariantNumeric: 'tabular-nums' } }, Math.round(shown)),
        h('span', { style: { fontSize: 22, fontWeight: 800, color: 'var(--accent)', marginLeft: 8 } }, unit)
      ),
      h(
        'div',
        {
          onPointerDown: (e) => {
            drag.current = { x: e.clientX, from: shown };
            e.currentTarget.setPointerCapture(e.pointerId);
          },
          onPointerMove: (e) => {
            if (!drag.current) return;
            const next = Math.min(max, Math.max(min, drag.current.from - (e.clientX - drag.current.x) / 13));
            setGhost(next);
            const r = Math.round(next);
            if (r !== value) onChange(r);
          },
          onPointerUp: () => { drag.current = null; setGhost(null); },
          onPointerCancel: () => { drag.current = null; setGhost(null); },
          style: {
            position: 'relative', height: 104, overflow: 'hidden', background: 'var(--surface-3)',
            borderRadius: 18, touchAction: 'pan-y', cursor: 'grab', userSelect: 'none',
          },
        },
        ticks.map((t) => {
          const major = t % 5 === 0;
          const offset = (t - shown) * 13;
          return h(
            'div',
            {
              key: t,
              style: {
                position: 'absolute', left: `calc(50% + ${offset}px)`, top: 18, transform: 'translateX(-50%)',
                display: 'flex', flexDirection: 'column', alignItems: 'center', pointerEvents: 'none',
              },
            },
            h('span', {
              style: {
                display: 'block', width: major ? 2.5 : 1.5, height: major ? 34 : 18, borderRadius: 2,
                background: major ? 'var(--muted-3)' : 'var(--line-2)',
              },
            }),
            major
              ? h('span', {
                  style: {
                    marginTop: 8, fontSize: 12, fontWeight: t === Math.round(shown) ? 900 : 700,
                    color: t === Math.round(shown) ? 'var(--accent)' : 'var(--muted-3)',
                  },
                }, t)
              : null
          );
        }),
        h('span', {
          style: {
            position: 'absolute', left: '50%', top: 12, transform: 'translateX(-50%)', width: 3, height: 46,
            borderRadius: 2, background: 'var(--grad)', pointerEvents: 'none',
          },
        }),
        ['left', 'right'].map((side) =>
          h('span', {
            key: side,
            style: {
              position: 'absolute', top: 0, bottom: 0, [side]: 0, width: 48, pointerEvents: 'none',
              background: `linear-gradient(to ${side === 'left' ? 'right' : 'left'}, var(--surface-3), transparent)`,
            },
          })
        )
      ),
      h('div', { style: { marginTop: 12, fontSize: 13, fontWeight: 700, color: 'var(--muted-3)' } }, 'Потяните линейку')
    );
  }

  function Age() {

    const [ghost, setGhost] = React.useState(null);
    const shown = ghost ?? value;
    const list = [];
    for (let a = Math.max(14, Math.round(shown) - 4); a <= Math.min(90, Math.round(shown) + 4); a++) list.push(a);
    const sizeFor = (d) => (d === 0 ? 34 : d === 1 ? 25 : d === 2 ? 21 : 18);
    const colorFor = (d) => (d === 0 ? 'var(--accent)' : d === 1 ? 'var(--muted)' : 'var(--muted-3)');
    return h(

      h(Title, { title: 'Сколько вам лет?', sub: 'Потяните список, чтобы выбрать.' }),
      h(
        'div',
        {
          style: { position: 'relative', background: 'var(--surface-3)', borderRadius: 20 },
          onPointerDown: (e) => {
            drag.current = { x: e.clientX, from: shown };
            e.currentTarget.setPointerCapture(e.pointerId);
          },
          onPointerMove: (e) => {
            if (!drag.current) return;
            const next = Math.min(90, Math.max(14, drag.current.from - (e.clientX - drag.current.x) / 13));
            setGhost(next);
            const r = Math.round(next);
            if (r !== value) setValue(r);
          },

        },
        h('div', {

        h(

          list.map((a, i) => {

                  transform: 'translateY(-50%)', display: 'flex', alignItems: 'center', justifyContent: 'center',
                  fontSize: sizeFor(d), fontWeight: 700, color: colorFor(d),
                  transition: ghost ? 'none' : 'top .18s ease',
                },
              },
              a
            );
          })
        ),
        ['top', 'bottom'].map((pos) =>
          h('span', {
            key: pos,
            style: {
              position: 'absolute', left: 0, right: 0, [pos]: 0, height: 104, borderRadius: 20, pointerEvents: 'none',
              background: `linear-gradient(to ${pos === 'top' ? 'bottom' : 'top'}, var(--surface-3), transparent)`,
            },
          })
        )
      )
    );
  }

  function Target() {
    const goal = state.goal;
    const bounds =
      goal === 'lose'
        ? { min: Math.max(40, state.weight - 30), max: state.weight }
        : goal === 'gain'
        ? { min: state.weight, max: Math.min(160, state.weight + 20) }
        : { min: Math.max(40, state.weight - 30), max: Math.min(160, state.weight + 5) };
    const target = Math.min(bounds.max, Math.max(bounds.min, state.target));
    const paceObj = PACES.find((p) => p.id === state.pace) || PACES[1];
    const weeks = Math.max(1, Math.ceil(Math.max(Number(goal !== 'keep'), Math.abs(state.weight - target)) / paceObj.kg));
    const eta = new Date(Date.now() + weeks * 7 * 864e5);
    const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
    const headline =
      goal === 'lose'
        ? `Сбросить ${Math.round(Math.abs(state.weight - target))} кг — реально к`
        : goal === 'gain'
        ? `Набрать ${Math.round(Math.abs(target - state.weight))} кг — реально к`
        : 'Удержать вес — план до';
    return h(
      Screen,
      qBase('target', { progress: qProgress('target'), ctaLabel: 'Далее', onCta: () => go('life') }),
      h('h1', { className: 'title', style: { marginBottom: 28 } },
        goal === 'lose' ? 'К какому весу хотите прийти?' : goal === 'keep' ? 'В каком весе держимся?' : 'До какого веса хотите дойти?'),
      h(Ruler, { value: target, min: bounds.min, max: bounds.max, onChange: (v) => set({ target: v }), unit: 'кг', valueSize: 54 }),
      h('div', { style: { height: 22 } }),

          h(

              key: p.id,

              onClick: () => set({ pace: p.id }),
              minHeight: 86,
              gap: 4,
              showCheck: false,
            },
            h('span', { style: { fontSize: 13.5, fontWeight: state.pace === p.id ? 800 : 700, color: state.pace === p.id ? 'var(--accent)' : 'var(--ink-2)' } }, p.name),
            h('span', { style: { fontSize: 15, fontWeight: 900, color: state.pace === p.id ? 'var(--accent)' : 'var(--ink)' } },
              `${goal === 'gain' ? '+' : '−'}${String(p.kg).replace('.', ',')} кг`),
            h('span', { style: { fontSize: 11, fontWeight: 600, color: 'var(--muted-3)' } }, 'в неделю')
          )
        )
      ),
      h('div', { style: { height: 14 } }),
      h(
        'div',
        { style: { background: 'var(--accent-soft)', border: '1px solid var(--accent-line)', borderRadius: 18, padding: 18, textAlign: 'center' } },
        h('div', { style: { fontSize: 13.5, fontWeight: 600, color: 'var(--muted-2)' } }, headline),
        h('div', { style: { fontSize: 22, fontWeight: 900, color: 'var(--accent)', marginTop: 5 } }, `${eta.getDate()} ${months[eta.getMonth()]}`)
      )
    );
  }

  function Period() {
    const today = new Date();
    const [view, setView] = React.useState(() => {
      if (state.periodDate) {
        const d = new Date(state.periodDate);
        return { y: d.getFullYear(), m: d.getMonth() };
      }
      return { y: today.getFullYear(), m: today.getMonth() };
    });
    const isCurrent = view.y === today.getFullYear() && view.m === today.getMonth();
    const firstWeekday = (new Date(view.y, view.m, 1).getDay() + 6) % 7;
    const daysInMonth = new Date(view.y, view.m + 1, 0).getDate();
    const cells = [...Array.from({ length: firstWeekday }, () => null), ...Array.from({ length: daysInMonth }, (_, i) => i + 1)];
    const months = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
    const arrows = (delta, enabled) =>
      h(
        'button',
        {
          type: 'button',
          disabled: !enabled,
          onClick: enabled
            ? () => {
                const total = view.m + delta;
                setView({ y: view.y + Math.floor(total / 12), m: ((total % 12) + 12) % 12 });
              }
            : undefined,
          'aria-label': delta < 0 ? 'Прошлый месяц' : 'Следующий месяц',
          style: {
            width: 32, height: 32, borderRadius: '50%', border: 'none', flex: 'none',
            background: enabled ? 'var(--surface-3)' : 'transparent', cursor: enabled ? 'pointer' : 'default',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            color: enabled ? 'var(--muted)' : 'var(--muted-3)',
          },
        },
        delta < 0 ? '‹' : '›'
      );
    return h(
      Screen,
      qBase('period', {
        progress: qProgress('period'),
        ctaLabel: 'Далее',
        ctaDisabled: !state.periodDate,
        onCta: () => go('norm'),
      }),
      h(Title, { title: 'Когда начались последние месячные?', sub: 'Нужно, чтобы рассчитать фазы цикла.' }),
      h(
        Card,
        { compact: true },
        h(
          'div',
          { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 } },
          arrows(-1, true),
          h('span', { style: { fontSize: 15, fontWeight: 900 } }, `${months[view.m]} ${view.y}`),
          arrows(1, !isCurrent)
        ),
        h(
          'div',
          { style: { display: 'grid', gridTemplateColumns: 'repeat(7, minmax(0, 1fr))', gap: 6 } },
