            h('span', { key: d, style: { textAlign: 'center', fontSize: 10.5, fontWeight: 800, textTransform: 'uppercase', color: 'var(--muted-3)' } }, d)),
          cells.map((day, i) => {
            if (day == null) return h('span', { key: 'e' + i });
            const iso = `${view.y}-${String(view.m + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const future = isCurrent && day > today.getDate();
            const selected = state.periodDate === iso;
            return h(
              'button',
              {
                key: iso,
                type: 'button',
                disabled: future,
                onClick: future ? undefined : () => set({ periodDate: iso }),
                style: {
                  aspectRatio: '1', borderRadius: 10, border: 'none', padding: 0,
                  fontSize: 13.5, fontWeight: selected ? 900 : 600,
                  cursor: future ? 'default' : 'pointer',
                  background: selected ? 'var(--grad)' : 'var(--surface-3)',
                  color: selected ? 'var(--accent-ink)' : future ? 'var(--muted-3)' : 'var(--ink-2)',
                  opacity: future ? 0.45 : 1,
                },
              },
              day
            );
          })
        )
      ),
      h('div', { className: 'spacer-10' }),
      h(
        Card,

        h(
          'div',

          h(
            'div',

            h('div', { style: { fontSize: 15, fontWeight: 800 } }, 'Длина цикла'),
            h('div', { style: { fontSize: 12.5, fontWeight: 500, color: 'var(--muted-2)', marginTop: 2 } }, 'Обычно 26–30 дней')

    const conic = `conic-gradient(var(--accent-2) 0% ${totalPct}%, #FFC56F ${totalPct}% ${totalPct + fatPct}%, var(--line-2) ${totalPct + fatPct}% 100%)`;
    return h(
      Screen,
      qBase('norm', { progress: qProgress('norm'), ctaLabel: 'Всё верно, продолжить', onCta: () => go('coffee') }),

/** Количество в человекочитаемом виде: штуки, упаковки, килограммы. */
function quantText(it) {
  if (it.unit === 'шт') {
    const packs = it.packs > 1 ? ` · ${it.packs} ${plural(it.packs, 'упаковка', 'упаковки', 'упаковок')}` : '';
    return `${it.amount} шт${packs}`;
  }
  if (it.amount >= 1000) return `${(it.amount / 1000).toFixed(2).replace('.', ',')} кг`;
  return `${it.amount} г`;
}

      h(
        'div',
        { className: 'section' },
        h('div', { className: 'section-head' }, h('h2', null, 'Что учтено')),
        h('div',
          { style: { marginBottom: 10 } },
          plan.coverage.ok
            ? h(Note, { emoji: '✅' }, plan.coverage.text)
            : h(Note, { emoji: '➕', title: 'Можно дотянуть до нормы' }, plan.coverage.text)),
        plan.budget.squeeze > 0 && h('div', { style: { marginBottom: 10 } }, h(Note, { emoji: '📉' },
          `Под бюджет порции уменьшены на ${plan.budget.squeeze}%. Овощи и крупы оставили полностью.`)),
        plan.actions.map((a, i) => h('div', { className: 'action', key: i },
          h('span', { className: 'emoji' }, a.emoji),
          h('div', null, h('div', { className: 'at' }, a.title), h('div', { className: 'ad' }, a.text))))
      ),

      plan.profile.likedProducts.length > 0 && h(
        'div',
        { className: 'section' },
        h('div', { className: 'section-head' },
          h('h2', null, 'Ваши любимые продукты'),
          h('span', { className: 'meta' }, `${plan.profile.likedProducts.length} ${plural(plan.profile.likedProducts.length, 'позиция', 'позиции', 'позиций')}`)),
        h('div', { className: 'section-note' }, 'Блюда с этими продуктами стоят в меню первыми — поэтому они и попали на неделю.'),
        h('div', { className: 'fav-chips' },
          plan.profile.likedProducts.map((id) => {
            const prod = BY_ID.get(id);
            return h('span', { className: 'fav-chip', key: id },
              prod ? productEmoji(id) : '🛒', ' ', prod?.name || id);
          }))
      ),

      h(
        'div',
        { className: 'print-all-days', style: { display: 'none' } },
        h('h2', { style: { fontSize: 22, fontWeight: 900, marginBottom: 14 } }, 'Меню на все 7 дней недели'),
        days.map((d) =>
          h('div', { key: d.name, style: { marginBottom: 16, pageBreakInside: 'avoid' } },
            h('h3', { style: { fontSize: 16, fontWeight: 800, margin: '10px 0 6px', color: '#E8763A' } }, `${d.name} (${d.isCook ? 'День готовки' : 'Разогрев'})`),
            d.meals.map((m, i) =>
              h('div', { key: i, style: { display: 'flex', justifyContent: 'space-between', padding: '5px 0', borderBottom: '1px solid #ddd', fontSize: 13.5 } },
                h('span', null, `${m.emoji} ${m.mealName}: `, h('b', null, m.recipe.name)),
                h('span', { style: { fontWeight: 700 } }, `${m.nutrition.kcal} ккал`)
              )
            )
          )
        )
      ),

      h(
        'div',
        { className: 'section', id: 'menu' },
        h('div', { className: 'section-head' },
          h('h2', null, 'Меню на неделю'),
          h('span', { className: 'meta' }, `${current.totals.kcal} ккал · ${rub(current.cost)}`)),
        h('div', { className: 'section-note' }, hasFam
          ? 'Ккал — на одну порцию, общие блюда едим все вместе.'
          : 'Ккал и БЖУ посчитаны на вашу порцию.'),
        h(
          'div',
          { className: 'day-nav' },
          days.map((d, i) =>
            h(
              'button',
              {
                key: d.name,
                type: 'button',
                className: 'day-tab' + (i === day ? ' on' : ''),
                onClick: () => { setDay(i); setOpenRecipe(null); },
              },
              d.name,
              h('small', null, d.isCook ? 'готовим' : `${d.totals.kcal}`)
            )
          )
        ),
        current.meals.map((m, i) =>
          h(
            'div',
            { className: 'meal-row', key: m.meal + i },
            h('span', { className: 'tag' }, `${m.emoji} ${m.mealName}`),
            h(
              'div',
              { style: { flex: 1, minWidth: 0, cursor: 'pointer' }, onClick: () => setOpenRecipe(openRecipe === i ? null : i) },
              h('div', { className: 'dish' }, m.recipe.name),
              h(
                'div',
                { className: 'dish-meta' },
                m.scope === 'fam'
                  ? h('span', { className: 'badge-mode badge-fam' }, `На всех · ${m.cookPortions} порц.`)
                  : h('span', { className: 'badge-mode ' + (m.mode === 'cook' ? 'badge-cook' : 'badge-warm') },
                      m.mode === 'cook' ? 'Готовим' : 'Разогреть'),
                m.recipe.tags?.length ? ` · ${m.recipe.tags.slice(0, 2).join(', ')}` : ''
              )
            ),
            h('span', { className: 'kcal' }, `${m.nutrition.kcal} ккал`),
            h('button', {
              type: 'button',
              onClick: () => setOpenRecipe(openRecipe === i ? null : i),
              'aria-label': 'Открыть рецепт',
              style: { border: 'none', background: 'transparent', cursor: 'pointer', padding: 4, flex: 'none' },
            }, h('span', {
              style: {
                display: 'block', width: 8, height: 8, borderRight: '2px solid var(--muted-3)',
                borderBottom: '2px solid var(--muted-3)',
                transform: openRecipe === i ? 'rotate(-135deg)' : 'rotate(45deg)',
              },
            }))
          )
        ),
        h('div', { className: 'totals' },
          h('span', null, `Итого за ${current.name}: ${current.totals.kcal} ккал`),
          h('span', null, `Б ${current.totals.p} · Ж ${current.totals.f} · У ${current.totals.c}`),
          h('span', null, rub(current.cost))),
        openRecipe != null && current.meals[openRecipe] && h('div', { style: { marginTop: 10 } },
          h(RecipeCard, {
            meal: current.meals[openRecipe],
            plan,
            open: true,
            onToggle: () => setOpenRecipe(null),
            onSwap: swap,
          }))
      ),

      h(
        'div',
        { className: 'section', id: 'recipes' },
        h('div', { className: 'section-head' },
          h('h2', null, 'Рецепты и замены'),
          h('button', {
            type: 'button',
            onClick: () => setShowPlan((v) => !v),
            style: { border: 'none', background: 'transparent', fontSize: 13, fontWeight: 800, color: 'var(--accent)', cursor: 'pointer' },
          }, showPlan ? 'свернуть' : 'показать')),
        showPlan ? h(
          Fragment,
          null,
          h('div', { className: 'section-note' }, 'Нажмите на блюдо — увидите состав, шаги и варианты замены.'),
          days.flatMap((d) =>
            d.meals.map((m, idx) => {
              const key = `${d.index}-${m.meal}-${idx}`;
              return h(RecipeCard, {
                key,
                meal: m,
                plan,
                open: openRecipe === key,
                onToggle: () => setOpenRecipe(openRecipe === key ? null : key),
                onSwap: swap,
              });
            })
          )
        ) : null
      ),

      h(
        'div',
        { className: 'section', id: 'shopping' },
        h('div', { className: 'section-head' },
          h('h2', null, 'Список покупок'),
          h('span', { className: 'meta' }, `${plan.shopping.items.length} позиций`)),
        h('div', { className: 'section-note' },
          `Цены — средние по сетям: ${STORES.map((s) => s.name).join(', ')}, с округлением до упаковок.`),
        h(ShoppingList, { plan, onToast: showToast })
      ),

      plan.substitutions.length > 0 && h(
        'div',
        { className: 'section' },
        h('div', { className: 'section-head' }, h('h2', null, 'Как сэкономить')),
        plan.substitutions.map((s) =>
          h('div', { className: 'action', key: s.label },
            h('span', { className: 'emoji' }, '💸'),
            h('div', null,
              h('div', { className: 'at' }, s.label),
              h('div', { className: 'ad' }, `Разница в цене до ${rub(s.saves)} за килограмм — на неделе это заметно.`))))
      ),

      h(
        'div',
        { className: 'section' },
        h('div', { className: 'section-head' }, h('h2', null, 'Что дальше')),
        h(Note, { emoji: '🧾' }, 'Закупитесь по списку, в дни готовки сделайте сразу партию — остальное только разогреть.'),
        h('div', { className: 'footer-actions' },
          h(Button, { variant: 'btn-ghost', onClick: onRefine }, 'Уточнить КБЖУ'),
          h(Button, { variant: 'btn-ghost', onClick: onRestart }, 'Начать сначала')),
        h('p', { className: 'footer-note' },
          'Это копия квиза «Рацион на неделю» без оплаты: весь рацион, список покупок и план активности доступны сразу. ',
          'Калорийность и цены — расчётные ориентиры, не медицинская рекомендация.')
      )
    ),
    toast ? h('div', { className: 'toast' }, toast) : null
  );
}

return { ResultScreen };
})();

/* ===== assets/js/app.js ===== */
var appNS = (function () {
/**
 * Точка входа приложения: состояние квиза, переходы между экранами,
 * дневная/ночная тема и бесплатный результат без пейволла.
 */

  const { h, loadState, saveState, clearState, applyTheme } = uiNS;
  const { makeScreens } = screensNS;
  const { ResultScreen } = resultNS;
  const { buildPlan, DEFAULT_STORES } = planNS;

const STORAGE_KEY = 'racion-clone-v3';
const THEME_KEY = 'racion-clone-theme';

const INITIAL = {
  stores: DEFAULT_STORES,
  adults: 2,
  kids: [],
  meals: ['breakfast', 'lunch', 'dinner'],
  famMeals: ['fam-dinner'],
  budget: null,
  sex: 'f',
  diet: 'omni',
  likedProducts: [],
  allergies: [],
  dislikes: [],
  stopFoods: [],
  kitchen: ['stove', 'oven', 'micro'],
  age: 29,
  height: 164,
  weight: 63,
  goal: 'lose',
  target: 58,
  pace: 'sure',
  life: 2,
  cycle: null,
  periodDate: null,
  cycleLen: 28,
  normMode: 'balance',
  normAdjust: 0,
  coffee: null,
  drinks: ['latte'],
  cups: 2,
  spoons: 1,
  repeat: 2,
  days: ['wed', 'sat'],
};

const SCREENS = [
  'intro', 'people', 'meals', 'budget', 'sex', 'diet', 'tastes', 'allergy',
  'kitchen', 'calc', 'age', 'height', 'weight', 'goal', 'target', 'life', 'cycle',
  'period', 'norm', 'coffee', 'drinks', 'repeat', 'days', 'result',
];

const STEPS = [
  { id: 'people', label: 'Кто ест' },
  { id: 'meals', label: 'Приёмы пищи' },
  { id: 'budget', label: 'Бюджет' },
  { id: 'sex', label: 'Пол' },
  { id: 'diet', label: 'Тип питания' },
  { id: 'tastes', label: 'Любимые продукты' },
  { id: 'allergy', label: 'Аллергии' },
  { id: 'kitchen', label: 'Кухня' },
];

const Q_STEPS = [
  { id: 'age', label: 'Возраст' },
  { id: 'height', label: 'Рост' },
  { id: 'weight', label: 'Вес' },
  { id: 'goal', label: 'Цель' },
  { id: 'target', label: 'Целевой вес' },
  { id: 'life', label: 'Активность' },
  { id: 'norm', label: 'Норма КБЖУ' },
  { id: 'repeat', label: 'Повторы' },
  { id: 'days', label: 'Дни готовки' },
];

/** Ключ набора блюд: стабилен в пределах дня, чтобы меню не «прыгало». */
function makeSeed(s) {
  return [
    new Date().toISOString().slice(0, 10),
    s.adults, s.kids.join(','), s.sex, s.diet,
    [...s.meals].sort().join(','), [...s.famMeals].sort().join(','),
    [...s.allergies].sort().join(','), [...s.dislikes].sort().join(','),
    s.stopFoods.join(','), [...s.kitchen].sort().join(','),
    s.repeat, [...s.days].sort().join(','), [...s.likedProducts].sort().join('.'),
  ].join('|');
}

function preferredTheme() {
  const saved = loadState(THEME_KEY);
  if (saved === 'night' || saved === 'day') return saved;
  try {
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day';
  } catch {
    return 'day';
  }
}

function RacionApp() {
  const restored = React.useMemo(() => loadState(STORAGE_KEY), []);
  const url = React.useMemo(() => {
    try {
      return new URLSearchParams(location.search);
    } catch {
      return new URLSearchParams('');
    }
  }, []);
  const themeParam = url.get('theme');
  const forcedScreen = url.get('screen');
  const forcedLiked = (url.get('liked') || '')
    .split(',')
    .map((s) => s.trim())
    .filter((id) => id);

  const [theme, setTheme] = React.useState(() =>
    themeParam === 'night' || themeParam === 'day' ? themeParam : preferredTheme()
  );
  const [screen, setScreen] = React.useState(() =>
    SCREENS.includes(forcedScreen) ? forcedScreen : SCREENS.includes(restored?.screen) ? restored.screen : 'intro'
  );
  const [state, setState] = React.useState(() => {
    const base = { ...INITIAL, ...(restored?.state || {}), stores: DEFAULT_STORES };
    if (forcedLiked.length) base.likedProducts = forcedLiked;
    return base;
  });
  const [plan, setPlan] = React.useState(null);
  const history = React.useRef([]);

  // Тема: применяем к документу и запоминаем выбор.
  React.useEffect(() => {
    applyTheme(theme);
    saveState(THEME_KEY, theme);
  }, [theme]);

  const toggleTheme = React.useCallback(() => {
    setTheme((t) => (t === 'night' ? 'day' : 'night'));
  }, []);

  React.useEffect(() => {
    saveState(STORAGE_KEY, { screen, state });
  }, [screen, state]);

  React.useEffect(() => {
    window.scrollTo(0, 0);
  }, [screen]);

  const set = React.useCallback((patch) => {
    setState((s) => ({ ...s, ...(typeof patch === 'function' ? patch(s) : patch) }));
  }, []);

  const go = React.useCallback((next) => {
    setScreen((cur) => {
      if (cur !== next) history.current.push(cur);
      return next;
    });
  }, []);

  const build = React.useCallback((s) => buildPlan({ ...s, budget: s.budget ?? undefined }), []);

  /** Собираем рацион и открываем результат — без оплаты. */
  const finish = React.useCallback(() => {
    setState((s) => {
      const next = { ...s, seed: makeSeed(s) };
      setPlan(build(next));
      return next;
    });
    setScreen('result');
  }, [build]);

  const finishQuestionnaire = finish;

  const refine = React.useCallback(() => go('age'), [go]);

  /** Начать сначала: спрашиваем подтверждение, чтобы не потерять рацион случайно. */
  const restart = React.useCallback(() => {
    const hasProgress = screen !== 'intro';
    if (hasProgress) {
      let ok = true;
      try {
        ok = window.confirm('Начать заново? Текущий рацион и ответы будут сброшены.');
      } catch {
        ok = true;
      }
      if (!ok) return;
    }
    clearState(STORAGE_KEY);
    setPlan(null);
    setState({ ...INITIAL, stores: DEFAULT_STORES });
    history.current = [];
    setScreen('intro');
  }, [screen]);

  React.useEffect(() => {
    const onPop = () => {
      const prev = history.current.pop();
      if (prev) setScreen(prev);
    };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  /**
   * Живое состояние для экранов. Сами компоненты создаём один раз (иначе React
   * пересоздаёт их и сбрасывает внутреннее состояние — активную вкладку, черновик
   * стоп-списка, бегунок), но читать они должны всегда актуальные данные.
   * Прокси поверх ref даёт и то, и другое.
   */
  const stateRef = React.useRef(state);
  stateRef.current = state;
  const liveState = React.useMemo(
    () =>
      new Proxy(
        {},
        {
          get: (_, key) => stateRef.current[key],
          has: (_, key) => key in stateRef.current,
          ownKeys: () => Reflect.ownKeys(stateRef.current),
          getOwnPropertyDescriptor: (_, key) => ({
            value: stateRef.current[key],
            enumerable: true,
            configurable: true,
            writable: true,
          }),
        }
      ),
    []
  );

  // Экраны создаём один раз на стабильных зависимостях и живом состоянии.
  const screens = React.useMemo(
    () => makeScreens({ state: liveState, set, go, finish, finishQuestionnaire, theme, toggleTheme, restart, steps: STEPS, qSteps: Q_STEPS }),
    // eslint-disable-next-line react-hooks/exhaustive-deps
    [liveState, set, go, finish, finishQuestionnaire, theme, toggleTheme, restart]
  );

  if (screen === 'result') {
    const current = plan || build(state);
    return h(ResultScreen, {
      plan: current,
      onRestart: restart,
      onRefine: refine,
      theme,
      onToggleTheme: toggleTheme,
      steps: STEPS,
      onGo: go,
    });
  }

  const View = screens[screen] || screens.intro;
  return h(View, null);
}

/** Запуск: рендерим приложение в #root. */
function render() {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(h(RacionApp));
}

render();

// Маркер для проверок: приложение смонтировалось.
setTimeout(() => {
  document.documentElement.setAttribute('data-app-ready', '1');
}, 0);

return { render };
})();
</script>
